  *{box-sizing:border-box}
  /* ---- mobile baseline: the platform tells on a web app, removed at the root ---- */
  html{
    -webkit-tap-highlight-color:transparent;   /* no grey flash over anything tapped */
    -webkit-text-size-adjust:100%;             /* no font inflation in landscape */
    overscroll-behavior:none}                  /* pull-to-refresh must not reload an unsaved sheet */
  /* controls are not content: they respond at once, and a long press does not
     select their label or pop the callout. Body text stays selectable. */
  button,a,[role=button],label.mini,.li.tap,.opt,.dpick,.seat,.chipx{
    touch-action:manipulation;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  body{margin:0;background:var(--chrome);color:var(--ink);font-size:var(--fs-body);font-optical-sizing:auto;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
  input,select,textarea{font-size:var(--fs-16)}  /* 16px or more stops iOS zooming on focus */
  a{color:var(--blue-text);text-decoration:none}
  button{font:inherit;cursor:pointer}
  ::placeholder{color:var(--placeholder);opacity:1}
  ::selection{background:var(--selection-bg);color:var(--ink)}
  html{scrollbar-color:var(--line-strong) transparent}
  input,select{font:inherit;color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;background:var(--surface);min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

  .logo{width:32px;height:32px;flex:none;display:block}
  .brand{font-family:inherit;font-weight:700;color:var(--white);font-size:var(--fs-20);line-height:1.1;letter-spacing:.01em}
  .lang{margin-left:auto;display:flex;border:1px solid var(--chrome-line);border-radius:var(--r-pill);overflow:hidden}
  .lang button{padding:5px 11px;font-size:var(--fs-12);font-weight:600;border:0;background:transparent;color:var(--chrome-text);letter-spacing:.04em;transition:background .16s ease,color .16s ease}

    overflow-x:auto;overflow-y:visible;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}

    border:0;background:transparent;border-radius:var(--r-md);font-family:inherit;font-size:var(--fs-14);font-weight:500;
    line-height:1;color:var(--chrome-text);white-space:nowrap;transition:background .16s ease,color .16s ease}
  .nav a.on,.nav .navbtn.on{color:var(--on-gold);background:var(--gold);font-weight:600}
  .nav .right{margin-left:auto}
  .nav .right.out{display:flex;align-items:center;gap:6px;opacity:.85}

  /* tabs + controls */
  .tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--rule)}
  /* a two-line label (Russian) must not push its neighbours to the top */
  .tabs a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px 4px;text-align:center;
    font-size:var(--fs-15);line-height:1.2;color:var(--muted);border-bottom:3px solid transparent;transition:color .16s ease,border-color .16s ease}
  .tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}

  .ctlbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;background:var(--surface);border-bottom:1px solid var(--rule)}
  .ctlbar .rangebtn{width:100%;justify-content:space-between}

  .seg.tiny{margin-left:auto;border-radius:var(--r-pill)}

  /* 1. iOS liquid-glass bottom tab bar (phones only) */
  .dock{display:none}
  @media (max-width:999px){
    /* a floating capsule that clears the home indicator, like iOS 26 */
    .dock{position:fixed;left:10px;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));
      z-index:var(--z-dock);display:flex;gap:2px;padding:5px 6px;border-radius:var(--r-pill);isolation:isolate;
      background:linear-gradient(180deg,var(--dock-glass-a),var(--dock-glass-b));
      -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
      box-shadow:0 1px 0 var(--dock-top) inset,0 -1px 1px var(--dock-edge) inset,
                 0 0 0 1px var(--dock-border)}
    /* specular sheen along the top of the glass */
    .dock::after{content:'';position:absolute;left:2px;right:2px;top:1px;height:52%;pointer-events:none;
      border-radius:var(--r-pill) 999px 60% 60% / 999px 999px 100% 100%;
      background:linear-gradient(180deg,var(--dock-sheen),rgba(255,255,255,0))}
    .dock a,.dock button{position:relative;z-index:1;flex:1;min-width:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;padding:6px 2px 5px;border:0;
      background:transparent;color:var(--muted);font-size:var(--fs-10);font-weight:600;letter-spacing:-.15px;
      transition:color .18s ease}
    /* one glass pill for the whole bar: it slides to the tab you pick */
    .dock .dpill{position:absolute;top:0;left:0;width:0;height:0;z-index:0;opacity:0;pointer-events:none;
      border-radius:var(--r-pill);
      background:linear-gradient(180deg,rgba(var(--blue-rgb),.17),rgba(var(--blue-rgb),.10));
      box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 0 0 .5px rgba(var(--blue-rgb),.14),
                 0 4px 10px -6px rgba(var(--shadow-rgb),.35);
      transition:transform .22s var(--ease-drawer),width .22s var(--ease-drawer),
                 height .2s ease,opacity .22s ease}
    .dock svg{position:relative;width:24px;height:24px;flex:none;stroke-width:1.75}
    .dock a.on,.dock button.on{color:var(--blue-text)}
    .dock a.on span,.dock button.on span{font-weight:700}
    .dock a:active,.dock button:active{opacity:.55}
    /* the highlight is draggable: press it and slide sideways to pick a tab.
       pan-y keeps vertical page scrolling working through the bar. */
    /* touch-action does NOT inherit, so the tabs themselves must declare it too:
       with them left at auto the browser was free to claim a touch that started on
       a tab for panning and fire pointercancel, which killed the drag once the page
       had somewhere to scroll. */
    .dock,.dock *{touch-action:pan-y}
    .dock{user-select:none;-webkit-user-select:none}
    .dock.dragging a:active,.dock.dragging button:active{opacity:1}
    .dock.dragging a,.dock.dragging button{transition:color .12s ease}
    .dock.dragging .dpill{background:linear-gradient(180deg,rgba(var(--blue-rgb),.24),rgba(var(--blue-rgb),.15));
      box-shadow:0 6px 16px -8px rgba(var(--blue-rgb),.55);will-change:transform}
    .dock span{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .wrap{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
    .wrap:has(.scroll){padding-bottom:0}
    /* clear the dock, plus however much of the screen Safari's toolbar covers
       right now (0 in a standalone web app, where lvh and dvh are equal) */
    .scroll{padding-bottom:calc(var(--dockpad,0px) + 100lvh - 100dvh)}
    .tabs.admtabs a{font-size:var(--fs-12-5);padding:8px 4px;letter-spacing:var(--track-tight)}
    .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    .savebar{bottom:calc(70px + env(safe-area-inset-bottom))}
  }

function songMatch(s, q){

  if (!qs) return true;
  if (s.title.toLowerCase().includes(qs)) return true;
  if (s.subtitle && String(s.subtitle).toLowerCase().includes(qs)) return true;
  const cn = s.category_id && typeof catName === 'function' ? catName(s.category_id) : '';

function shift(months){ const d = new Date(); d.setMonth(d.getMonth() - months); return localISO(d); }
function fmtLong(iso){ const [y,m,d] = iso.split('-').map(Number);
  return S.lang === 'en' ? MONF.en[m-1] + ' ' + d + ', ' + y : d + ' ' + MONF.ru[m-1] + ' ' + y; }
function fmtShort(iso){ const [y,m,d] = iso.split('-');
  return m + '/' + d + '/' + y.slice(2); }   // numeric dates stay mm/dd/yy in both languages
function fmtPill(iso){ const [y,m,d] = iso.split('-');
  return MON[S.lang][+m-1] + ' ' + +d + ', ' + y; }
function monthKey(iso){ const [y,m] = iso.split('-').map(Number); return MON[S.lang][m-1] + ' ' + String(y).slice(2); }

/* ---------- data ---------- */
/* Supabase caps one response at 1000 rows, and years of absences run well past
   that — read every table in pages so nothing silently goes missing. Ordering
   is fully deterministic, otherwise page boundaries could skip or repeat rows. */
async function selectAll(table, order){
  const STEP = 1000;
  let rows = [], from = 0;
  for (;;) {
    let q = sb.from(table).select('*');
    order.forEach(c => { q = q.order(c); });
    const r = await q.range(from, from + STEP - 1);
    if (r.error) return { data: rows, error: r.error };
    rows = rows.concat(r.data || []);
    if ((r.data || []).length < STEP) return { data: rows, error: null };
    from += STEP;
  }
}
async function load(silent){
  if (!silent) { S.loading = true; render(); }
  const [si, so, ev, ab, es, sc, doc] = await Promise.all([
    selectAll('singers', ['part','sort_order','name']),
    selectAll('songs', ['title','id']),
    selectAll('events', ['date','id']),
    selectAll('absences', ['event_id','singer_id']),
    selectAll('event_songs', ['event_id','position','song_id']),
    selectAll('song_categories', ['name']),
    sb.from('documents').select('*').eq('key','rules').maybeSingle()
  ]);
  const err = [si,so,ev,ab,es].find(r => r.error);
  S.error = err ? err.error.message : '';
  S.singers = si.data || []; S.songs = so.data || []; S.events = ev.data || [];
  S.absences = ab.data || []; S.eventSongs = es.data || [];
  S.categories = sc.error ? [] : (sc.data || []);
  S.rules = doc.error ? null : doc.data;
  S.loading = false; render();
  prefetchSheets();
  trackRoute();
}

/* Three states per singer per event. Only the exceptions are stored:
   an absences row with status 'absent' (missed it) or 'not_listed' (was not in
   the choir yet — excluded from their percentage). No row at all = present. */
function attStatus(e,s){
  const a = S.absences.find(x => x.event_id === e && x.singer_id === s);
  if (a) return a.status === 'not_listed' ? 'na' : 'absent';
  /* No row normally means present — but not for events before the singer joined:
     a brand-new member must not inherit perfect attendance for the past. */
  const sg = S.singers.find(x => x.id === s);
  if (sg && sg.joined_on) {
    const evt = S.events.find(x => x.id === e);
    if (evt && evt.date < sg.joined_on) return 'na';
  }
  return 'present';
}
const isAbsent = (e,s) => attStatus(e,s) === 'absent';
/* present / total, counting only events the singer was actually in the choir for */
function attCount(ev, sid){
  let miss = 0, na = 0;
  ev.forEach(e => {
    if (e.cancelled) { na++; return; }          // nothing happened that day
    const st = attStatus(e.id, sid);
    if (st === 'absent') miss++; else if (st === 'na') na++;
  });
  const of = ev.length - na;
  return { miss, na, of, came: of - miss, pct: of ? Math.round((of - miss) / of * 100) : null };
}
const wasSung  = (e,s) => S.eventSongs.some(x => x.event_id === e && x.song_id === s);
/* the songs of one service, in the order the director set */
function songsFor(evId){
  return S.eventSongs.filter(x => x.event_id === evId)
    .slice().sort((a,b) => (a.position ?? 9999) - (b.position ?? 9999))
    .map(x => S.songs.find(s => s.id === x.song_id)).filter(Boolean);
}
/* Order links carry only the first 8 characters of the event's id: a full uuid
   made the shared message unwieldy. Nothing about the stored data changes — the
   token is resolved back to the event here, exact match first, then by prefix, so
   every full-length link already sitting in a chat keeps working. */
function shortId(id){ return String(id).slice(0, 8); }
/* When was this song last sung before a given date, ignoring one event (the one
   being planned) — used to warn the director about repeating something too soon. */
function lastSungBefore(songId, beforeIso, exceptEvId){
  let best = null;
  for (const x of S.eventSongs) {
    if (x.song_id !== songId || (exceptEvId && x.event_id === exceptEvId)) continue;
    const e = S.events.find(y => y.id === x.event_id);
    if (!e || e.cancelled) continue;
    if (beforeIso && e.date > beforeIso) continue;
    if (!best || e.date > best) best = e.date;
  }
  return best;
}
function agoText(iso, refIso){
  const days = Math.round((Date.parse(refIso || today()) - Date.parse(iso)) / 86400000);
  if (days <= 0) return t('agoToday');
  if (days === 1) return t('agoYesterday');
  if (days < 7) return t('agoDays')(days);
  return t('agoWeeks')(Math.round(days / 7));
}
/* ---------- offline sheets ----------

/* Blocks are only as wide as they need to be: in view mode nothing empty trails

function blockCols(p, map, editing){
  let used = 0;
  for (let r = 1; r <= 2; r++) for (let c = 1; c <= SEATMAX; c++) if (map.get(p + ':' + r + ':' + c)) used = c > used ? c : used;

function seatMap(){
  const m = new Map();

    const rec = { id: s.id, sur: p[0], given: p.slice(1).join(' ') };
    if (!bySurname.has(rec.sur)) bySurname.set(rec.sur, []);
    bySurname.get(rec.sur).push(rec);

  bySurname.forEach(list => list.forEach(x => {
    if (!x.given) return out.set(x.id, x.sur);
    let n = 1;
    while (n < x.given.length && list.some(y => y !== x && y.given.slice(0, n) === x.given.slice(0, n))) n++;
    out.set(x.id, x.sur + ' ' + x.given.slice(0, n) + (n < x.given.length ? '.' : ''));

function seatSaveBar(){

      <div class="st ${n?'live':''}">${esc(n ? t('seatsMovedN')(n) : t('noChanges'))}</div>

async function saveSeats(){
  const rows = seatDelta();
  if (!rows.length || !await ensureSession()) return;
  const EMPTY = { seat_block: null, seat_row: null, seat_col: null };
  /* A chair may hold only one person, so vacate every chair involved before
     filling any of them — otherwise a simple swap collides with the singer who
     is still sitting there. If a later write fails the pending moves stay on
     screen and Save can be pressed again: the chairs are already empty. */
  const clear = await sb.from('singers').update(EMPTY).in('id', rows.map(r => r.s.id)).select();
  if (!wrote(clear)) return render();
  rows.forEach(({ s }) => Object.assign(s, EMPTY));
  for (const { s, v } of rows) {
    if (!v) continue;
    const patch = { seat_block: v.b, seat_row: v.r, seat_col: v.c };
    const res = await sb.from('singers').update(patch).eq('id', s.id).select();
    if (!wrote(res)) return render();
    Object.assign(s, patch);
  }

/* ---------- choir rules ---------- */
/* The director keeps this as plain text, so the page understands a handful of
   marks: # heading, - / 1. lists, an indented "a." sub-point, ==highlight==
   (the yellow marker of the printed copy), **bold** and > for a quotation. */
function rulesBody(src){
  const inline = s => esc(s).replace(/==([^=]+)==/g, '<mark>$1</mark>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  const open = kind => { if (list !== kind) { close(); out.push('<' + kind + '>'); list = kind; } };
  String(src || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) { close(); return; }
    let m;
    if ((m = line.match(/^#+\s+(.+)/)))      { close(); out.push('<h3>' + inline(m[1]) + '</h3>'); return; }
    if ((m = line.match(/^>\s*(.+)/)))       { close(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); return; }
    if ((m = line.match(/^(\d+)\.\s+(.+)/))) { open('ol'); out.push('<li>' + inline(m[2]) + '</li>'); return; }
    if (/^\s{2,}/.test(raw) && (m = line.match(/^([a-zа-я])[.)]\s+(.+)/i))) {
      if (!list) open('ul');
      out.push('<li class="sub">' + inline(m[1] + '. ' + m[2]) + '</li>'); return;
    }
    if ((m = line.match(/^[-*•]\s+(.+)/)))   { open('ul'); out.push('<li>' + inline(m[1]) + '</li>'); return; }
    close(); out.push('<p>' + inline(line) + '</p>');
  });
  close();
  return out.join('');
}
function rulesPage(){

    <article class="doc paper">${body.trim() ? rulesBody(body) : `<p style="color:var(--muted)">${esc(t('rulesEmpty'))}</p>`}</article>`;

const MDLINE = { h: '# ', ol: '1. ', ul: '- ', sub: '  a. ', quote: '> ' };
function applyMd(kind){
  const box = document.getElementById('rules-edit');
  if (!box) return;
  const v = box.value, a = box.selectionStart, b = box.selectionEnd;
  if (kind === 'mark' || kind === 'bold') {
    const tag = kind === 'mark' ? '==' : '**';
    const sel = v.slice(a, b) || (kind === 'mark' ? t('mdMark') : t('mdBold'));
    box.value = v.slice(0, a) + tag + sel + tag + v.slice(b);
    box.setSelectionRange(a + tag.length, a + tag.length + sel.length);
  } else {
    const pre = MDLINE[kind];
    /* Numbered and lettered lists run past their first item, so the "is it
       already applied?" test has to match any number or letter, not "1." / "a.". */
    const has = kind === 'ol' ? /^\s*\d+[.)]\s+/ : kind === 'sub' ? /^\s*[a-zа-я][.)]\s+/i : null;
    const LETTERS = S.lang === 'ru' ? 'абвгдежзик' : 'abcdefghij';
    let start = v.lastIndexOf('\n', a - 1) + 1;
    let end = v.indexOf('\n', b); if (end === -1) end = v.length;
    const lines = v.slice(start, end).split('\n');
    const off = lines.every(l => !l.trim() || (has ? has.test(l) : l.startsWith(pre)));   // tap again to remove
    let n = 0;
    const next = lines.map(l => {
      if (!l.trim()) return l;
      const bare = l.replace(/^(\s*)(#+\s+|[-*•]\s+|\d+[.)]\s+|[a-zа-я][.)]\s+|>\s*)?/i, '');
      if (off) return bare;
      const mark = kind === 'ol' ? (n + 1) + '. '
                 : kind === 'sub' ? '  ' + (LETTERS[n] || LETTERS[LETTERS.length-1]) + '. '
                 : pre;
      n++;
      return mark + bare;
    }).join('\n');
    box.value = v.slice(0, start) + next + v.slice(end);
    box.setSelectionRange(start, start + next.length);
  }
  if (S.rulesEdit) S.rulesEdit[S.lang] = box.value;
  box.focus();
}
async function saveRules(){
  const box = document.getElementById('rules-edit');    // absent while previewing
  if (!S.rulesEdit || !await ensureSession()) return;
  if (box) S.rulesEdit[S.lang] = box.value;              // whatever is on screen right now
  const patch = { key: 'rules', updated_at: new Date().toISOString() };
  /* Only languages the director actually changed are written, so editing the
     English text can never overwrite the Russian one. */
  if (S.rulesEdit.en !== ((S.rules && S.rules.body_en) || '')) patch.body_en = S.rulesEdit.en;
  if (S.rulesEdit.ru !== ((S.rules && S.rules.body_ru) || '')) patch.body_ru = S.rulesEdit.ru;
  if (patch.body_en === undefined && patch.body_ru === undefined) { S.rulesEdit = null; return render(); }
  const res = await sb.from('documents').upsert(patch, { onConflict: 'key' }).select();
  if (!wrote(res)) return render();
  S.rules = res.data[0]; S.rulesEdit = null; S.rulesPreview = false;
  okToast(t('rulesSaved')); render();
}

    const x = ib.left - tb.left + track.scrollLeft, y = ib.top - tb.top + track.scrollTop;
    const key = thumbKey(track, items);
    const idx = items.indexOf(on);
    let fresh = false;
    if (!thumb) {
      fresh = true;
      thumb = document.createElement('i');
      thumb.className = 'ithumb';
      thumb.setAttribute('aria-hidden', 'true');
      track.insertBefore(thumb, track.firstChild);
    }
    track.classList.add('hasthumb');
    const prev = THUMBS.get(key);
    const moved = prev && (Math.abs(prev.x - x) > .75 || Math.abs(prev.y - y) > .75 || Math.abs(prev.w - ib.width) > .75);
    /* Sub-pixel re-measures must not touch a live pill: resetting its transition
       mid-slide would snap it to the end (the old "blink"). */
    if (!fresh && prev && !moved && prev.i === idx) { THUMBS.set(key, { x, y, w: ib.width, i: idx }); return; }
    if (prev && (moved || prev.i !== idx)) {
      thumb.style.transition = 'none';
      thumb.style.width = prev.w + 'px';
      thumb.style.height = ib.height + 'px';
      thumb.style.transform = 'translate(' + prev.x + 'px,' + prev.y + 'px)';
      void thumb.offsetWidth;                       // commit the start position
      thumb.style.transition = THUMB_EASE;
    }
    else thumb.style.transition = 'none';
    thumb.style.width = ib.width + 'px';
    thumb.style.height = ib.height + 'px';

function editFor(mode, ev){

  if (!S.edit || S.edit.key !== key) {
    const base = new Map();
    if (ev.id !== 'new') {
      if (mode === 'att') S.absences.filter(a => a.event_id === ev.id)
        .forEach(a => base.set(a.singer_id, a.status === 'not_listed' ? 'na' : 'absent'));
      else songsFor(ev.id).forEach((s, i) => {
        const r = songRow(ev.id, s.id) || {};
        base.set(s.id, { pos: i + 1, c: r.conductor_id || '', p: r.pianist_id || '' });
      });
    }
    const sel = new Map(base);
    /* nothing marked yet: everyone starts absent and the director taps who came */
    if (mode === 'att' && (ev.id === 'new' || !hasAtt(ev)))
      S.singers.forEach(s => { if (s.active !== false) sel.set(s.id, s.joined_on && ev.date && ev.date < s.joined_on ? 'na' : 'absent'); });
    S.edit = { key, mode, evId: ev.id, base, sel,

async function squareJpeg(file, size){
  size = size || 320;
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });

    return await new Promise(ok => c.toBlob(ok, 'image/jpeg', .86));

async function uploadPhoto(s, file){

    const path = s.id + '/' + Date.now() + '.jpg', old = s.photo_path;
    const up = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg', upsert: true });
    if (up.error) { S.photoBusy = null; return fail(up.error); }
    const res = await sb.from('singers').update({ photo_path: path }).eq('id', s.id).select();
    if (!wrote(res)) { await sb.storage.from('photos').remove([path]); S.photoBusy = null; return render(); }
    s.photo_path = path;
    if (old) sb.storage.from('photos').remove([old]).then(() => {}, () => {});

  S.photoBusy = null; render();
}

      const test = line ? line + ' ' + w : w;
      if (line && x.measureText(test).width > width) { out.push(line); line = w; } else line = test;
    });
    out.push(line); return out;

  y += fs * 1.1;

/* ---------- CSV export ---------- */
function download(name, text){
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

/* Full-database backup: every table, paged past PostgREST's 1000-row cap. */
async function fullBackup(){
  S.backingUp = true; render();
  try {
    const dump = { exported_at: new Date().toISOString(), app: document.title, tables: {} };
    for (const tbl of ['singers','events','songs','song_categories','absences','event_songs']) {
      const rows = [];
      for (let fromRow = 0;;) {
        const { data, error } = await sb.from(tbl).select('*').range(fromRow, fromRow + 999);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 1000) break;
        fromRow += 1000;
      }
      dump.tables[tbl] = rows;
    }
    const stamp = today();
    const url = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 1)], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'choir-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { S.toast = t('backupFail'); }
  S.backingUp = false; render();
}

function exportCSV(kind){
  const xf = S.exportPreset === 'all' ? EPOCH : shift(+S.exportPreset);   // export has its own period
  const ev = S.events.filter(kind === 'att' ? hasAtt : hasSongs)
    .filter(e => inRange(e.date, xf, today()))
    .slice().sort((a,b) => a.date < b.date ? -1 : 1);
  if (kind === 'att') {
    const head = ['singer','part', ...ev.map(e => e.date + ' ' + evLabel(e))];
    const rows = PARTS.flatMap(p => S.singers.filter(s => s.part === p && s.active !== false).map(s =>
      [s.name, p, ...ev.map(e => { if (e.cancelled) return 'Cancelled';
        const st = attStatus(e.id, s.id);
        return st === 'absent' ? 'Absent' : st === 'na' ? 'Not Listed' : 'Present'; })]));
    download('attendance-' + S.from + '_' + S.to + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  } else {
    const head = ['date','event','no','song','subtitle'];
    const rows = [];
    ev.forEach(e => songsFor(e.id).forEach((s, i) => {
      rows.push([e.date, e.name || e.kind, i + 1, s.title, s.subtitle]);
    }));
    download('songs-' + S.from + '_' + S.to + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  }
}

/* ---------- motion ----------
   #app is rebuilt wholesale on every render, so an exit cannot be a CSS
   transition: the node is gone before one could run. Play the exit on the live
   node, then re-render when it finishes. Entrances that happen once per state
   change are queued here and claimed by afterRender. */
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const EASE = { out:'cubic-bezier(.2,.8,.3,1)', drawer:'cubic-bezier(.32,.72,0,1)',
               fade:'cubic-bezier(.33,0,.2,1)' };
let pendingReveal = null;     // selector of a panel that should grow open
let pendingPop = null;        // selector of an element that should land
let menuClosing = false;      // an exit slide is in flight
let wasLoading = false;       // the last paint was the loading shimmer
let toastWasUp = false;       // a toast was on screen at the previous paint
function playOut(specs, then){
  const runs = calm() ? [] : specs.filter(s => s.el && s.el.animate)
    .map(s => s.el.animate(s.kf, { duration:s.ms, easing:s.easing, fill:'forwards' }));
  if (!runs.length) return then();
  let left = runs.length, fired = false;
  const go = () => { if (!fired && --left <= 0) { fired = true; then(); } };
  runs.forEach(a => { a.onfinish = go; a.oncancel = go; });
  setTimeout(() => { if (!fired) { fired = true; then(); } }, 500);  // never strand a render
}
/* A collapse is the one place height is worth animating, and the panel has no
   size until it is in the document — so measure the real node and grow to it. */
function reveal(sel){
  const el = sel && document.querySelector(sel);
  if (!el || !el.animate) return;
  if (calm()) return void el.animate([{opacity:0},{opacity:1}], { duration:120 });
  const h = el.getBoundingClientRect().height;
  if (!h) return;
  const was = el.style.overflow;
  el.style.overflow = 'hidden';
  const a = el.animate([{height:'0px',opacity:0},{height:h+'px',opacity:1}],
    { duration:200, easing:EASE.out });
  a.onfinish = a.oncancel = () => { el.style.overflow = was; };
}
/* One thing lands; the seat it left stays put. Two moving things read as a glitch. */
function pop(sel){
  const el = sel && document.querySelector(sel);
  if (!el || !el.animate) return;
  el.animate(calm() ? [{opacity:0},{opacity:1}]
    : [{opacity:0,transform:'scale(.94)'},{opacity:1,transform:'none'}],
    { duration:calm() ? 120 : 140, easing:EASE.out });
}
/* The shimmer is replaced by a whole page of fresh geometry in one frame. The
   masthead was already there, so it does not take part. */
function fadeInBody(){
  const app = document.getElementById('app');
  if (!app) return;
  [...app.children].forEach(k => {
    if (!k.animate || (k.classList && k.classList.contains('mast'))) return;
    k.animate([{opacity:0},{opacity:1}], { duration:calm() ? 120 : 300, easing:EASE.fade });
  });
}
/* A theme flip repaints every colour at once. Where the browser can cross-fade
   the whole document, let it. */
function paint(fn){
  if (calm() || !document.startViewTransition) return fn();
  document.startViewTransition(fn);
}
/* The menu arrives over 300ms and used to leave in a single frame, while the
   scrim behind it faded — the two disagreed. A dismissal plays the slide back
   out; tapping a menu item does not, because then the new page is the story. */
function dismissMenu(){
  if (menuClosing) return;                  // already leaving
  S.menuOpen = false;
  document.body.classList.remove('mlock');
  if (matchMedia('(min-width:1000px)').matches) return render();   // a permanent sidebar
  menuClosing = true;
  playOut([
    { el:document.querySelector('.drawer.on'), ms:250, easing:EASE.drawer,
      kf:[{transform:'none'},{transform:'translateX(105%)'}] },
    { el:document.querySelector('.scrim.on'), ms:200, easing:'ease',
      kf:[{opacity:1},{opacity:0}] }
  ], () => { menuClosing = false; if (!S.menuOpen) render(); });
}
/* It arrives from 8px below; it leaves the same way. */
function hideToast(){
  playOut([{ el:document.querySelector('.toast'), ms:160, easing:'ease-out',
    kf:[{opacity:1,transform:'none'},{opacity:0,transform:'translateY(8px)'}] }],
    () => { S.toast = ''; S.toastOk = false; S.retry = null; render(); });
}

/* Size the grid to the space actually left below it. Measuring must not disturb
   the box: clearing maxHeight first would remove the overflow, reset scrollTop,
   change the page height and re-trigger this through the viewport listener. */
let fitPending = false;
function fitGrid(){
  /* Tapping a chair re-renders the stage, so put the sideways scroll back where
     the reader had it instead of snapping to the far left. */
  const st = document.querySelector('.stagewrap');
  if (st) {
    const skey = S.seatPart + '|' + S.seatView;
    if (S.stageKey !== skey) {
      /* Open on the aisle between the two block columns — the real middle of the
         stage — rather than the far left or the midpoint of unequal blocks. */
      S.stageKey = skey;
      const al = st.querySelector('.blk.al');
      const aisle = al ? al.getBoundingClientRect().right - st.getBoundingClientRect().left + st.scrollLeft + 6
                       : st.scrollWidth / 2;
      const max = st.scrollWidth - st.clientWidth;
      S.stageLeft = Math.min(max, Math.max(0, Math.round(aisle - st.clientWidth / 2)));
      st.scrollLeft = S.stageLeft;
    }
    else if (S.stageLeft) st.scrollLeft = S.stageLeft;
    st.addEventListener('scroll', () => { S.stageLeft = st.scrollLeft; }, { passive: true });
  }
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  let below = 0;
  for (let n = sc.nextElementSibling; n; n = n.nextElementSibling) {
    if (getComputedStyle(n).position === 'fixed') continue;
    below += n.getBoundingClientRect().height;
  }
  below += parseFloat(getComputedStyle(sc).marginBottom) || 0;   // the card's own gap to the bottom edge
  sc.style.setProperty('--vw', sc.clientWidth + 'px');
  /* Measure from the top of the PAGE, not the top of the screen: using the on-screen
     position meant a page that had already scrolled produced a taller grid, which made
     the page scroll further — on an iOS home-screen app that ran away until the header
     was unreachable. */
  const docTop = sc.getBoundingClientRect().top + window.scrollY;
  /* the phone dock is fixed and lives outside .scroll's parent, so the sibling
     loop above never sees it — take its height off the top explicitly. */
  const dk = document.querySelector('.dock');
  const dockH = dk && getComputedStyle(dk).display !== 'none' ? dk.offsetHeight + 22 : 0;
  /* the glass dock floats over the grid, as on every other page — so the grid runs
     to the bottom edge and carries the dock's height as inner padding instead, which
     still lets the last row scroll clear of it. */
  sc.style.setProperty('--dockpad', dockH ? dockH + 'px' : '0px');
  const off = Math.round(docTop + below);
  const sig = off + '|' + dockH;
  if (sc.dataset.fit === sig) return;                  // already right: don't touch it
  sc.dataset.fit = sig;
  /* The grid fills the LARGE viewport (lvh) because that is the box a fixed
     element — the dock — is positioned against in iOS Safari. dvh stops above
     Safari's bottom toolbar, which is why the grid ended early there. The rows
     that fall behind the toolbar and the dock are cleared by padding instead
     (see --dockpad), so everything stays reachable by scrolling. */
  sc.style.maxHeight = Math.max(220, vh - off) + 'px';        // fallback if lvh is unsupported
  sc.style.maxHeight = 'calc(100lvh - ' + off + 'px)';
}
function queueFit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fitGrid(); });
}
window.addEventListener('resize', queueFit, { passive: true });
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueFit, { passive: true });

/* the sideways timeline keeps its place when the page redraws (a date moved, a song order deleted) */
document.addEventListener('scroll', e => { const x = e.target; if (x && x.classList && x.classList.contains('htl')) S.htlX = x.scrollLeft; }, { capture: true, passive: true });
function afterRender(){
  { const hx = document.querySelector('.htl'); if (hx && S.htlX) hx.scrollLeft = S.htlX; }
  lbCountUp();
  document.querySelectorAll('textarea.lyrta').forEach(autoGrow);
  if (wasLoading) { wasLoading = false; fadeInBody(); }
  /* A second message inside the 2.5s window swaps the words in place: the node
     is new every render, so the entrance would otherwise replay under it. */
  const tn = document.querySelector('.toast');
  if (tn) { if (toastWasUp) tn.style.animation = 'none'; toastWasUp = true; }
  else toastWasUp = false;
  reveal(pendingReveal); pendingReveal = null;
  pop(pendingPop); pendingPop = null;
  /* Place the switcher thumbs before this frame paints: waiting a frame showed the
     plain CSS pill at the new spot first, which is the flash. */
  syncThumbs();
  /* Re-measure once the new page has laid out: the pill was placed while the old
     page was still on screen, so a width change (scrollbar, grid fit) left it a
     couple of pixels off centre. */
  requestAnimationFrame(() => requestAnimationFrame(() => { moveDockPill(); syncThumbs(); }));
  const lf = document.getElementById('loginform');
  if (lf && !lf.dataset.wired) {
    lf.dataset.wired = '1';
    lf.addEventListener('submit', e => { e.preventDefault(); signIn(); });
  }
  /* Tapping a chair re-renders the stage, so put the sideways scroll back where
     the reader had it instead of snapping to the far left. */
  const st = document.querySelector('.stagewrap');
  if (st) {
    const skey = S.seatPart + '|' + S.seatView;
    if (S.stageKey !== skey) {
      /* Open on the aisle between the two block columns — the real middle of the
         stage — rather than the far left or the midpoint of unequal blocks. */
      S.stageKey = skey;
      const al = st.querySelector('.blk.al');
      const aisle = al ? al.getBoundingClientRect().right - st.getBoundingClientRect().left + st.scrollLeft + 6
                       : st.scrollWidth / 2;
      const max = st.scrollWidth - st.clientWidth;
      S.stageLeft = Math.min(max, Math.max(0, Math.round(aisle - st.clientWidth / 2)));
      st.scrollLeft = S.stageLeft;
    }
    else if (S.stageLeft) st.scrollLeft = S.stageLeft;
    st.addEventListener('scroll', () => { S.stageLeft = st.scrollLeft; }, { passive: true });
  }
  const sc = document.querySelector('.scroll');

/* An expired access token is rejected by row-level security with no error object —
   the write simply affects nothing. Refresh before every admin write, and treat
   "zero rows changed" as a lost session rather than a success. */
async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.session = null; render(); return false; }
  if ((session.expires_at || 0) * 1000 - Date.now() < 60000) {
    const { data, error } = await sb.auth.refreshSession();
    if (error || !data.session) {
      // The stored token is dead. Clear it locally, or every later call retries
      // it and Supabase logs another "Invalid Refresh Token".
      await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      S.session = null; location.hash = '#/login'; return false;
    }
    S.session = data.session;
  }
  return true;
}

function wrote(res){

    fail({ message: t('sessionLost') });

    return false;
  }
  return true;
}

    if (error) { S.uploading = null; await sb.storage.from(K.bucket).remove([path]); return fail(error); }
    song[K.col] = path;
    if (old) await sb.storage.from(K.bucket).remove([old]);
    S.uploading = null; return render();
  }
  if (el.dataset.range) {
    const v = el.value;
    S.preset = null; S.rangeSet = true;
    if (el.dataset.edge === 'from') S.from = v; else S.to = v;
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-move-date') && S.edit) {
    if (e.target.value) { S.edit.newDate = e.target.value; render(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.query = e.target.value;
    const pos = e.target.selectionStart; render();
    const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.menuOpen) dismissMenu();
  if (e.key === 'Escape' && (S.addOpen || S.editSongRow || S.editPerson || S.editCat) && document.querySelector('.modal')) { S.addOpen = null; S.editSongRow = null; S.editPerson = null; S.editCat = null; render(); }
});
window.addEventListener('hashchange', () => {
  requestAnimationFrame(() => {          // after the route handler paints the new page
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const app = document.getElementById('app');
    if (!app) return;
    const kids = [...app.children];
    const di = kids.findIndex(k => k.classList && k.classList.contains('drawer'));
    /* The page cross-fades in place — no slide, which read as a flash on dense
       pages. The switchers and their control row are the same on both sides of the
       move, so they stay put and only their thumb slides. */
    const STAY = 'tabs ctlbar ctrl searchrow obar';
    const fade = n => n.animate &&
      n.animate([{opacity:0},{opacity:1}],{duration:300,easing:'cubic-bezier(.33,0,.2,1)'});
    kids.slice(di + 1).forEach(k => {
      const cl = k.classList;
      if (!cl) return fade(k);
      if ([...cl].some(c => STAY.includes(c))) return;
      /* on the grid pages the switcher lives in the sticky bar inside .scroll */
      if (cl.contains('scroll')) {
        [...k.children].forEach(c => { if (!c.classList.contains('topctl')) fade(c); });
        return;
      }
      fade(k);
    });
    [...app.querySelectorAll('.tiles .tile')].slice(0, 9).forEach((tl, i) => tl.animate &&
      tl.animate([{opacity:0,transform:'translateY(14px) scale(.985)'},{opacity:1,transform:'none'}],
        {duration:340,delay:60 + i * 45,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'}));
  });
});

/* ---------- top-bar song search ----------
   Lives outside render(): typing only redraws the suggestion list, so the field
   keeps its focus and caret. A pick opens Choir music and flashes the song's row. */
let tsSel = 0;
function tsList(q){
  q = (q || '').trim();
  if (!q) return [];
  const ql = q.toLowerCase(), qa = lat(q), nm = s => String(s.name || '').toLowerCase();
  const wordStart = s => nm(s).split(/\s+/).some(w => w.startsWith(ql)) || (qa && lat(s.name).split(' ').some(w => w.startsWith(qa))) ? 0 : 1;
  const tStart = s => s.title.toLowerCase().startsWith(ql) || (qa && lat(s.title).startsWith(qa));
  const people = S.singers.filter(s => s.part && s.active !== false && (nm(s).includes(ql) || (/[a-z]/.test(qa) && lat(s.name).includes(qa))))
    .sort((a, b) => wordStart(a) - wordStart(b) || a.name.localeCompare(b.name, 'ru')).slice(0, 4)
    .map(m => ({ k: 'm:' + m.id, m }));
  const songs = S.songs.filter(s => s.active !== false && songMatch(s, q))
    .sort((a, b) => (tStart(a) ? 0 : 1) - (tStart(b) ? 0 : 1) || a.title.localeCompare(b.title, 'ru'))
    .slice(0, people.length ? 6 : 8).map(s => ({ k: 's:' + s.id, s }));
  /* a name typed from its start puts the people first, unless a song title starts the same way */
  const peopleFirst = people.length && !wordStart(people[0].m) && !(songs[0] && tStart(songs[0].s));
  return peopleFirst ? people.concat(songs) : songs.concat(people);
}
const tsInput = () => { const a = document.activeElement;
  return a && a.classList && a.classList.contains('tsin') ? a : document.getElementById(S.msOpen ? 'msearch' : 'tsearch'); };
function tsDraw(){
  const inp = tsInput(), box = inp && inp.closest('.findsong,.msrch') ? inp.closest('.findsong,.msrch').querySelector('.tsugg') : null;
  if (!inp || !box) return;
  const q = inp.value, list = tsList(q);
  if (!q.trim()) { box.hidden = true; box.innerHTML = ''; inp.setAttribute('aria-expanded', 'false'); return; }
  tsSel = Math.min(tsSel, Math.max(0, list.length - 1));
  box.innerHTML = list.length ? list.map((it, i) => it.m ? `<a href="#" role="option" data-ts="${it.k}" class="${i === tsSel ? 'on' : ''}" aria-selected="${i === tsSel}">
      <span class="tsi av">${avIn(it.m)}</span>
      <span class="grow2"><span class="tst">${esc(it.m.name)}</span><span class="tsm">${esc(partName(it.m.part))}</span></span>
      <em>${esc(t('tsReport'))}</em></a>` : (s => `<a href="#" role="option" data-ts="${it.k}" class="${i === tsSel ? 'on' : ''}" aria-selected="${i === tsSel}">
      <span class="tsi">${AIC.sheets}</span>
      <span class="grow2"><span class="tst">${esc(s.title)}${pvTag(s)}</span>${catName(s.category_id) ? `<span class="tsm">${esc(catName(s.category_id))}</span>` : ''}</span>
      <em>${esc(t('tSheets'))}</em></a>`)(it.s)).join('')
    : `<div class="tsnone">${esc(t('tsNone'))}</div>`;
  box.hidden = false;
  inp.setAttribute('aria-expanded', 'true');
}
function tsGo(k){
  k = String(k || ''); const id = k.slice(2);
  const m = k[0] === 'm' && S.singers.find(x => x.id === id), s = k[0] === 's' && S.songs.find(x => x.id === id);
  if (!m && !s) return;
  document.querySelectorAll('.tsin').forEach(i => { i.value = ''; i.blur(); });
  msClose();
  if (s) return showInSheets(id);
  location.hash = memberLink(m);   // everyone gets the person's report card
}
function showInAtt(id){
  S.hiMember = id;
  if (location.hash.startsWith('#/attendance/summary')) render(); else location.hash = '#/attendance/summary';
  let tries = 0;
  const unlit = () => { S.hiMember = null; document.querySelectorAll('[data-mrow].mhi').forEach(r => r.classList.remove('mhi')); };
  const find = () => {
    const row = document.querySelector('[data-mrow="' + id + '"]');
    if (!row) { if (++tries < 30) setTimeout(find, 60); return; }
    requestAnimationFrame(() => {
      const r = row.getBoundingClientRect();
      window.scrollTo({ top: Math.max(0, window.scrollY + r.top - window.innerHeight / 2 + r.height / 2), behavior: 'smooth' });
      setTimeout(() => {
        const base = window.scrollY;
        const onScroll = () => {
          if (S.hiMember !== id) return window.removeEventListener('scroll', onScroll);
          if (Math.abs(window.scrollY - base) > 80) { unlit(); window.removeEventListener('scroll', onScroll); }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
      }, 1000);
    });
  };
  setTimeout(find, 80);
}
/* open Choir music with the whole list, bring the song's row into view and keep it
   highlighted. The highlight is state (S.hiSong) rendered as a class, so a redraw
   while the page loads can't wipe it; it clears once the reader scrolls on. */
function showInSheets(id){
  S.query = ''; S.catFilter = 'all'; S.hiSong = id;
  if (location.hash === '#/sheets') render(); else location.hash = '#/sheets';
  let tries = 0;
  const find = () => {
    const row = document.querySelector('[data-srow="' + id + '"]');
    if (!row) { if (++tries < 30) setTimeout(find, 60); return; }
    requestAnimationFrame(() => {
      const r = row.getBoundingClientRect();
      window.scrollTo({ top: Math.max(0, window.scrollY + r.top - window.innerHeight / 2 + r.height / 2), behavior: 'smooth' });
      setTimeout(() => {
        const base = window.scrollY;
        const onScroll = () => {
          if (S.hiSong !== id) return window.removeEventListener('scroll', onScroll);
          if (Math.abs(window.scrollY - base) > 80) { clearHi(); window.removeEventListener('scroll', onScroll); }
        };
        window.addEventListener('scroll', onScroll, { passive: true });
      }, 1000);                                  // after the smooth scroll has settled
    });
  };
  setTimeout(find, 80);
}
function clearHi(){ S.hiSong = null; document.querySelectorAll('[data-srow].hi').forEach(r => r.classList.remove('hi')); }
const isTs = el => el && el.classList && el.classList.contains('tsin');
document.addEventListener('input', e => { if (isTs(e.target)) { tsSel = 0; tsDraw(); } });
document.addEventListener('focusin', e => { if (isTs(e.target)) tsDraw(); });
document.addEventListener('focusout', e => {
  if (!isTs(e.target)) return;
  const b = e.target.closest('.findsong,.msrch') && e.target.closest('.findsong,.msrch').querySelector('.tsugg');
  setTimeout(() => { if (b && document.activeElement !== e.target) b.hidden = true; }, 120);
});
/* phone search: the field grows out of the button in place, so opening it focuses
   the input inside the same tap (that is what brings the keyboard up on iOS) */
function msOpen(){
  const m = document.querySelector('.mast'), i = document.getElementById('msearch');
  if (!m || !i) return;
  S.msOpen = true; m.classList.add('msopen');
  m.querySelectorAll('.msrch [tabindex]').forEach(x => x.tabIndex = 0);
  i.focus({ preventScroll: true });
}
function msClose(){
  const m = document.querySelector('.mast'), i = document.getElementById('msearch');
  S.msOpen = false;
  if (i) { i.value = ''; i.blur(); }
  if (m) { m.classList.remove('msopen'); m.querySelectorAll('.msrch [tabindex]').forEach(x => x.tabIndex = -1);
    const b = m.querySelector('.tsugg'); if (b) { b.hidden = true; b.innerHTML = ''; } }
}
document.addEventListener('click', e => {
  const v = e.target.closest && e.target.closest('[data-view-music]');
  if (v) { e.preventDefault(); e.stopPropagation(); showInSheets(v.dataset.viewMusic); return; }
  const o = e.target.closest && e.target.closest('[data-msearch-open],[data-msearch-close]');
  if (!o) return;
  e.preventDefault(); e.stopPropagation();
  if (o.hasAttribute('data-msearch-open')) msOpen(); else msClose();
}, true);
document.addEventListener('mousedown', e => {
  const a = e.target.closest && e.target.closest('[data-ts]');
  if (a) { e.preventDefault(); tsGo(a.dataset.ts); }
});
document.addEventListener('click', e => {
  const a = e.target.closest && e.target.closest('[data-ts]');
  if (a) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('keydown', e => {
  if (!isTs(e.target)) return;
  const list = tsList(e.target.value);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!list.length) return;
    tsSel = (tsSel + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
    tsDraw();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (list[tsSel]) tsGo(list[tsSel].k);
  } else if (e.key === 'Escape') {
    if (e.target.id === 'msearch') return msClose();
    e.target.value = ''; tsDraw(); e.target.blur();
  }
});
window.addEventListener('hashchange', () => {
  S.reviewKey = null;
  S.ripple = true;
  const prevPage = (S.route || '').split('?')[0], prevFull = S.route || '';
  S.route = normRoute(location.hash);
  if (S.route.startsWith('#/member') && prevFull && !prevFull.startsWith('#/member')) S.memberFrom = prevFull;
  if (S.route.split('?')[0] !== prevPage) S.mMissAll = false;   // where the report card was opened from
  if (S.route.split('?')[0] !== prevPage) window.scrollTo(0, 0);
  prefetchSheets();
  trackRoute();
  S.menuOpen = false; S.msOpen = false; S.lbWho = null; S.lbSeen = null; S.lbTie = 0;
  if (!S.route.startsWith('#/sheets')) S.hiSong = null;
  if (!S.route.startsWith('#/attendance')) S.hiMember = null;
  document.body.classList.remove('mlock');
  if (!/^#\/admin\/(attendance|songs)\/.+/.test(S.route)) { S.edit = null; S.pending = null; }
  if (!S.route.startsWith('#/seating')) { S.seatEdit = null; S.seatSel = null; }
  if (!S.route.startsWith('#/rules')) { S.rulesEdit = null; S.rulesPreview = false; }
  S.error = ''; S.query = ''; S.editPerson = null; S.editSongRow = null; S.editCat = null; S.addOpen = null;
  render();
});

/* ---------- boot ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('online', () => { if (S.toast) { S.toast = ''; render(); } load(true); });
S.from = shift(6); S.to = today();
let wasWide = isWide();
window.addEventListener('resize', () => { if (isWide() !== wasWide) { wasWide = isWide(); render(); } });
const { data: { session } } = await sb.auth.getSession();
S.session = session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; render(); });
// iOS suspends a home-screen app rather than closing it: the token can be hours
// stale when it comes back. Refresh it, and re-read the data, on return.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.session) await ensureSession();
  load(true);
});
await load();
</script>
