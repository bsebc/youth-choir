<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSEBC Youth Choir</title>
<link rel="icon" href="favicon.svg?v=3135" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3135">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#17203a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Youth Choir">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17203a; --paper:#eff0ec; --rule:#dcded7; --blue:#2c3e8f;
    --red:#9e3b2e; --gold:#c9a227; --green:#3f7d4e; --muted:#6b7166; --faint:#8a9086;
    --nameW:152px; --tallyW:46px; --cell:34px; --songW:168px;
  }
  @media (min-width:900px){ :root{ --nameW:220px; --tallyW:62px; --cell:40px; --songW:280px; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
  input,select,textarea{font-size:16px}  /* 16px or more stops iOS zooming on focus */
  a{color:var(--blue);text-decoration:none}
  a:hover{color:var(--ink)}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;background:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  /* masthead */
  .mast{background:var(--ink);border-bottom:2px solid var(--gold);padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;flex:none;display:block}
  .brand{font-family:'Alice',serif;color:#fff;font-size:20px;line-height:1.1;letter-spacing:.01em}
  .lang{margin-left:auto;display:flex;border:1px solid #3a4463;border-radius:999px;overflow:hidden}
  .lang button{padding:5px 11px;font-size:12px;font-weight:600;border:0;background:transparent;color:#9aa3bd;letter-spacing:.04em;transition:background .16s ease,color .16s ease}
  .lang button:hover:not(.on){color:#fff}
  .lang button.on{background:var(--gold);color:var(--ink)}
  .nav{display:flex;align-items:center;gap:2px;background:var(--ink);padding:5px 8px;
    overflow-x:auto;overflow-y:visible;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a,.nav .navbtn{flex:none;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;
    border:0;background:transparent;border-radius:8px;font-family:inherit;font-size:14px;font-weight:500;
    line-height:1;color:#9aa3bd;white-space:nowrap;transition:background .16s ease,color .16s ease}
  .nav a:hover,.nav .navbtn:hover{color:#fff;background:rgba(255,255,255,.08)}
  .nav a.on,.nav .navbtn.on{color:var(--ink);background:var(--gold);font-weight:600}
  .nav a.on:hover,.nav .navbtn.on:hover{color:var(--ink);background:#d5ae2e}
  .nav .right{margin-left:auto}
  .nav .right.out{display:flex;align-items:center;gap:6px;opacity:.85}

  /* tabs + controls */
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--rule)}
  /* a two-line label (Russian) must not push its neighbours to the top */
  .tabs a{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;padding:10px 4px;text-align:center;
    font-size:15px;line-height:1.2;color:var(--muted);border-bottom:3px solid transparent;transition:color .16s ease,border-color .16s ease}
  .tabs a:hover{color:var(--ink)}
  .tabs a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
  .ctrl{background:#fff;padding:12px 14px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
  .ctlbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--rule)}
  .ctlbar .rangebtn{width:100%;justify-content:space-between}
  .ctlbar .seg.tiny{margin-left:0}
  .ctlbar .seg.tiny button{flex:1}
  .ctlbar.wide{flex-direction:row;align-items:center;gap:14px;padding:8px 20px;flex-wrap:wrap}
  .ctlbar.wide .chips{flex:none}
  .ctlbar.wide .chips button{padding:7px 16px}
  .ctlbar.wide .dates{flex:none;width:300px}
  .ctlbar.wide .seg.tiny{margin-left:auto}
  .ctlbar.wide .rangebtn{width:auto}
  .rangebtn.open{border-color:var(--ink);background:#fff}
  .rangebtn{display:flex;align-items:center;gap:7px;border:1px solid var(--blue);background:#f2f4fb;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rangebtn .lb{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .rangebtn .rv{font-weight:600}
  .rangebtn .ed{font-style:normal;color:var(--blue);font-weight:600;font-size:12px}
  .seg.tiny{margin-left:auto;border-radius:999px}
  .seg.tiny button{padding:7px 11px;font-size:13px}
  .panel{background:#fbfbf9;border-bottom:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.78);
    backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--rule);box-shadow:0 -6px 20px -14px rgba(23,32,58,.4);z-index:5}
  .savebar .st{flex:1;min-width:0;font-size:13px;color:var(--muted)}
  .savebar .st.live{color:var(--ink);font-weight:600}
  .savebar .sb{min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid var(--rule);
    background:#fff;color:#3c4438;transition:background .15s ease,border-color .15s ease,opacity .15s ease}
  .savebar .sb.ghost:hover{background:var(--paper)}
  .savebar .sb.go{background:var(--blue);border-color:var(--blue);color:#fff}
  .savebar .sb.go:hover{background:#33488f}
  .savebar .sb[disabled]{opacity:.45;cursor:default}
  .caret{width:20px;flex:none;display:flex;align-items:center;justify-content:flex-end;color:var(--faint)}
  .caret svg{transition:transform .16s ease}
  .caret.up svg{transform:rotate(180deg)}
  .li.on .caret{color:var(--blue)}
  .subrow{background:#fbfbf9;border-bottom:1px solid var(--rule);padding:4px 16px 12px}
  .subrow .dh{display:flex;align-items:baseline;gap:8px;padding:10px 0 6px;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .subrow .dh span{text-transform:none;letter-spacing:0;color:var(--faint)}
  .subrow .dr{display:flex;align-items:baseline;gap:12px;padding:5px 0;border-top:1px solid #e9eae4}
  .subrow .dd{width:44%;flex:none;font-size:14px;font-variant-numeric:tabular-nums}
  .subrow .dk{flex:1;min-width:0;font-size:13px;color:var(--muted)}
  .subrow .dk.cx{color:var(--red)}
  .ver{padding:4px 16px 24px;text-align:center;font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .ver a{color:var(--faint);text-decoration:underline;text-underline-offset:2px}
  .ver a:hover{color:var(--ink)}
  .notespanel{margin:0 16px 28px;padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:#fbfbf9}
  .notespanel .nh{font-family:'Alice',serif;font-size:15px;margin-bottom:8px}
  .notespanel ul{margin:0;padding-left:18px;display:grid;gap:5px}
  .notespanel li{font-size:13px;color:#3c4438;line-height:1.35}
  .body.adm{background:var(--paper);padding-bottom:18px}
  .body.adm .h{background:transparent;border-bottom:0;padding:16px 16px 6px}
  .sec{margin:12px 12px 0;background:#fff;border:1px solid var(--rule);border-radius:14px;box-shadow:0 1px 3px rgba(23,32,58,.06);overflow:hidden}
  .sec:empty{display:none}
  .sec > :last-child{border-bottom:0}
  @media (min-width:900px){ .sec{margin:16px 20px 0} }
  .addbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border:0;background:#fff;color:var(--blue);font-weight:600;font-size:15px;font-family:inherit;transition:background .15s ease}
  .addbtn i{font-style:normal;width:22px;height:22px;flex:none;border-radius:50%;background:#f2f4fb;border:1px solid #c6cde6;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
  .addbtn:hover{background:#fbfbf9}
  .addbtn.open{color:var(--muted)}
  .addbtn.open i{background:var(--paper);border-color:var(--rule);color:var(--muted)}
  .sectbar em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);margin-left:8px}
  .fold{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;border:0;
    border-bottom:1px solid var(--rule);background:var(--paper);text-align:left;font-family:inherit;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fold span{flex:1;min-width:0}
  .fold em{font-style:normal;font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;color:var(--blue)}
  .fold.open{background:#fff}
  .crow{padding:12px 16px;border-bottom:1px solid var(--rule);background:#fff}
  .crow .ct{display:flex;gap:8px;font-size:15px;line-height:1.25;margin-bottom:8px}
  .crow .ct span{flex:none;min-width:1.3em;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
  .crow .cf{display:flex;gap:8px}
  .cr{flex:1;min-width:0;display:grid;gap:4px}
  .cr em{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .cr select{width:100%;min-width:0;border:1px solid var(--rule);border-radius:7px;background:#fff;
    padding:7px 8px;font-size:13px;color:var(--ink)}
  .who{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11px;color:var(--muted);
    white-space:nowrap;vertical-align:middle}
  .who i{font-style:normal;font-weight:700;font-size:9px;line-height:1;padding:2px 4px;border-radius:3px;
    background:var(--paper);border:1px solid var(--rule);color:var(--faint)}
  .s .st{vertical-align:middle}
  .subrow .dc{flex:none;text-align:right}
  .subrow .dc .who{margin-left:6px}
  .dpick{position:relative;flex:1;min-width:0;display:block}
  .dpick span{display:block;border:1px solid var(--rule);border-radius:8px;background:#fbfbf9;
    padding:10px 11px;font-size:15px;line-height:1.2;color:var(--ink);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s ease,background .15s ease}
  .dpick:hover span{border-color:#b9bdb2;background:#fff}
  .dpick.hdr{position:relative;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;
    width:30px;height:30px;border-radius:50%;color:var(--blue);background:rgba(44,62,143,.08);
    align-self:center;flex:none}
  .dpick.hdr:hover{background:rgba(44,62,143,.16)}
  .dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;border:0;padding:0;background:transparent}
  .dpick:focus-within span{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(44,62,143,.12)}
  .dates .sep{flex:none;color:var(--faint)}
  .s b{display:inline-block;min-width:1.3em;margin-right:7px;color:var(--muted);font-weight:600;
    font-variant-numeric:tabular-nums}
  .pager{display:flex;align-items:center;gap:10px;padding:0 16px 20px}
  .pager .pg{flex:1;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  a.back{text-decoration:none}
  .back{border:0;background:transparent;font-size:26px;line-height:1;color:var(--faint);padding:0 8px 0 0;margin-right:2px}
  .back:hover{color:var(--ink)}
  .searchrow{padding:12px;background:#fff;border-bottom:1px solid var(--rule)}
  .hero{padding:22px 16px 4px;font-family:'Alice',serif;font-size:19px;line-height:1.3;color:var(--ink);background:#fff;text-wrap:pretty}
  .hero::after{content:'';display:block;width:38px;height:2px;background:var(--gold);margin-top:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 28px;background:#fff}
  @media (min-width:700px){ .tiles{grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 20px 34px} }
  .tile{display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule);border-radius:18px;padding:16px;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,32,58,.05);transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
  .tile:hover{border-color:#c3c8be;box-shadow:0 10px 26px -12px rgba(23,32,58,.28);transform:translateY(-2px)}
  .tile:active{transform:translateY(0);box-shadow:0 1px 2px rgba(23,32,58,.05)}
  .tile.dark:hover{border-color:var(--gold)}
  .tile .tt{font-family:'Alice',serif;font-size:17px;line-height:1.15}
  .tile .ts{font-size:12px;color:var(--muted);line-height:1.3;text-wrap:pretty}
  .tile.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.dark .ts{color:#9aa3bd}
  /* app-style icons, drawn from plain divs */
  .ic{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,#fbfbf9,var(--paper));border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;padding:9px;box-shadow:inset 0 1px 0 #fff}
  .tile:hover .ic{border-color:#c3c8be}
  .tile.dark .ic{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
  .ic-note{width:100%;height:100%;display:block;overflow:visible}
  @media (min-width:900px){ .panel{flex-direction:row;align-items:center;gap:20px} .panel .dates{max-width:420px} }
  @media (min-width:900px){ .ctrl{flex-direction:row;align-items:center;flex-wrap:wrap;padding:16px 20px} }
  .dates{display:flex;align-items:center;gap:8px}
  .dates input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:16px;background:#fbfbf9;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:#3c4438;white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease}
  .chips button:hover:not(.on){border-color:#b9bdb2;background:#fff}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
  .seg button{flex:1;padding:8px 6px;font-size:14px;border:0;background:#fff;color:#3c4438;border-left:1px solid var(--rule);transition:background .15s ease,color .15s ease}
  .seg button:hover:not(.on){background:var(--paper)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--ink);color:#fff;font-weight:600}
  .field{width:100%;max-width:100%;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:10px 11px;font-size:16px;background:#fbfbf9;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
  .field:focus,.dates input:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(44,62,143,.12)}
  input[type=date].field{-webkit-appearance:none;appearance:none;display:block;text-align:left}
  .card{min-width:0}
  .card > *{min-width:0;max-width:100%}
  .dates input{-webkit-appearance:none;appearance:none}
  /* grid */
  .scroll{overflow:auto;background:#fff;border-bottom:1px solid var(--rule);
    overscroll-behavior-x:contain;overscroll-behavior-y:auto}
  .gwrap{min-width:max-content}
  .topctl{position:sticky;left:0;z-index:7;width:var(--vw,100%);background:#fff}
  .endbar{position:sticky;left:0;width:var(--vw,100%);background:#fff;border-top:1px solid var(--rule)}
  .endbar + .endbar{border-top:0}
  .row{display:flex;min-width:100%}
  .spacer{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:#fff;border-right:2px solid var(--ink)}
  .hmonth{position:sticky;top:0;z-index:5}
  .hmonth .spacer{z-index:6;height:26px;background:#f4f5f1;border-bottom:1px solid var(--rule)}
  .hmonth .m{height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Alice',serif;font-size:13px;background:#f4f5f1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden}
  .hday{position:sticky;top:26px;z-index:5}
  .hday .spacer{z-index:6;height:40px;display:flex;align-items:center;padding:0 8px;font-family:'Alice',serif;font-size:13px;color:var(--muted);border-bottom:2px solid var(--ink)}
  .hday .d{width:var(--cell);flex:none;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff;border-right:1px solid var(--rule);border-bottom:2px solid var(--ink)}
  .hday .d.svc{background:#e7ebf5}
  .hday .d span{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .hday .d em{font-size:10px;font-style:normal;color:var(--muted);line-height:1}
  .hday .d.svc em{color:var(--blue)}
  .sect{display:flex;min-width:100%;position:sticky;top:66px;z-index:4}
  .sect .lbl{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:var(--paper);color:var(--ink);border-left:3px solid var(--gold);border-bottom:1px solid var(--rule);height:28px;display:flex;align-items:center;padding:0 10px;font-family:'Alice',serif;font-size:12px;letter-spacing:.16em}
  .sect.soprano .lbl{border-left-color:#d4a92c}
  .sect.alto .lbl{border-left-color:#4d68b6}
  .sect.tenor .lbl{border-left-color:#5c8a55}
  .sect.bass .lbl{border-left-color:#5a678c}
  .sect .fill{flex:1 0 auto;height:28px;background:var(--paper);color:var(--muted);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:11px}
  .name{width:var(--nameW);flex:none;height:var(--cell);position:sticky;left:0;z-index:2;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tally{width:var(--tallyW);flex:none;height:var(--cell);position:sticky;left:var(--nameW);z-index:2;background:#fbfbf9;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:#3c4438;border-right:2px solid var(--ink);border-bottom:1px solid var(--rule)}
  .tally.ok{color:var(--green)}
  .tally.mid{color:var(--gold)}
  .tally.low{color:var(--red)}
  .cell{width:var(--cell);flex:none;height:var(--cell);display:flex;align-items:center;justify-content:center;background:#fff;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15px;font-weight:700;color:var(--red)}
  .cell.svc{background:#e7ebf5}
  .cell.na{background:#f1f2ee;color:#b3b7ac}
  .cell.cx{background:repeating-linear-gradient(135deg,#eceee8 0 4px,#f6f7f3 4px 8px);color:#b3b7ac;font-size:13px}
  .hday .d.cx{color:var(--faint);background:#f0f1ed}
  .hday .d.cx em{color:#b3b7ac}
  .legend i.cx{background:repeating-linear-gradient(135deg,#eceee8 0 4px,#f6f7f3 4px 8px);border-color:var(--rule)}
  .cell .ab{font-style:normal;font-family:'Golos Text',system-ui,sans-serif;font-size:12px;font-weight:600;color:#b3564a}
  .cell .sq{width:14px;height:14px;background:var(--ink)}
  .tail{flex:1 0 auto;background:#fff;border-bottom:1px solid var(--rule)}
  .srow .name,.srow .tally,.srow .cell{height:48px}
  .srow .name{width:var(--songW);flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;white-space:normal;line-height:1.15}
  .srow .tally{left:var(--songW)}
  .srow .spacer,.srow.hd .spacer{width:calc(var(--songW) + var(--tallyW))}
  .sub{font-size:11px;color:var(--faint);font-style:italic}

    radial-gradient(260px 190px at 14% -28%,rgba(129,96,226,.22),transparent 62%)}

    radial-gradient(280px 260px at 4% 104%,rgba(90,115,220,.18),transparent 62%)}
  .drawer > *{position:relative}

  @media (min-width:1000px){

    .wrap{max-width:1560px;margin:0;
      margin-left:calc(272px + max(0px,(100vw - 272px - 1560px)/2));
      border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
    .toast{left:calc(272px + 12px)}
  }

/* Supabase caps one response at 1000 rows, and years of absences run well past
   that — read every table in pages so nothing silently goes missing. Ordering
   is fully deterministic, otherwise page boundaries could skip or repeat rows. */
async function selectAll(table, order){
  const STEP = 1000;
  let rows = [], from = 0;
  for (;;) {
    let q = sb.from(table).select('*');
    order.forEach(c => { q = q.order(c); });
    const r = await q.range(from, from + STEP - 1);
    if (r.error) return { data: rows, error: r.error };
    rows = rows.concat(r.data || []);
    if ((r.data || []).length < STEP) return { data: rows, error: null };
    from += STEP;
  }
}
async function load(silent){
  if (!silent) { S.loading = true; render(); }
  const [si, so, ev, ab, es, sc, doc] = await Promise.all([
    selectAll('singers', ['part','sort_order','name']),
    selectAll('songs', ['title','id']),
    selectAll('events', ['date','id']),
    selectAll('absences', ['event_id','singer_id']),
    selectAll('event_songs', ['event_id','position','song_id']),
    selectAll('song_categories', ['name']),
    sb.from('documents').select('*').eq('key','rules').maybeSingle()
  ]);
  const err = [si,so,ev,ab,es].find(r => r.error);
  S.error = err ? err.error.message : '';
  S.singers = si.data || []; S.songs = so.data || []; S.events = ev.data || [];
  S.absences = ab.data || []; S.eventSongs = es.data || [];
  S.categories = sc.error ? [] : (sc.data || []);
  S.rules = doc.error ? null : doc.data;
  S.loading = false; render();
}

/* Three states per singer per event. Only the exceptions are stored:
   an absences row with status 'absent' (missed it) or 'not_listed' (was not in
   the choir yet — excluded from their percentage). No row at all = present. */
function attStatus(e,s){
  const a = S.absences.find(x => x.event_id === e && x.singer_id === s);
  if (a) return a.status === 'not_listed' ? 'na' : 'absent';
  /* No row normally means present — but not for events before the singer joined:
     a brand-new member must not inherit perfect attendance for the past. */
  const sg = S.singers.find(x => x.id === s);
  if (sg && sg.joined_on) {
    const evt = S.events.find(x => x.id === e);
    if (evt && evt.date < sg.joined_on) return 'na';
  }
  return 'present';
}
const isAbsent = (e,s) => attStatus(e,s) === 'absent';
/* present / total, counting only events the singer was actually in the choir for */
function attCount(ev, sid){
  let miss = 0, na = 0;
  ev.forEach(e => {
    if (e.cancelled) { na++; return; }          // nothing happened that day
    const st = attStatus(e.id, sid);
    if (st === 'absent') miss++; else if (st === 'na') na++;
  });
  const of = ev.length - na;
  return { miss, na, of, came: of - miss, pct: of ? Math.round((of - miss) / of * 100) : null };
}

/* ---------- seating chart ---------- */
const SEATCOLS = 9;      // the usual width of a block; blocks grow past it when needed
const SEATMAX = 16;      // hard ceiling, so a stray tap can't create a mile-wide stage
/* The stage as the audience sees it: tenor and bass behind, soprano and alto in front. */
const SEATBLOCKS = [['tenor','bass'],['soprano','alto']];
const seatOf = s => (s.seat_block && s.seat_row && s.seat_col) ? { b:s.seat_block, r:+s.seat_row, c:+s.seat_col } : null;
const seatEff = s => (S.seatEdit && S.seatEdit.has(s.id)) ? S.seatEdit.get(s.id) : seatOf(s);
const seatRoster = () => S.singers.filter(s => isSinger(s) && s.active !== false);
const seatKey = x => x ? x.b + ':' + x.r + ':' + x.c : '';
/* Blocks are only as wide as they need to be: in view mode nothing empty trails
   off the end, and while editing there is always one spare column to grow into. */
function blockCols(p, map, editing){
  let used = 0;
  for (let r = 1; r <= 2; r++) for (let c = 1; c <= SEATMAX; c++) if (map.get(p + ':' + r + ':' + c)) used = c > used ? c : used;
  return editing ? Math.min(Math.max(used + 1, SEATCOLS), SEATMAX) : used;
}
function seatMap(){
  const m = new Map();
  seatRoster().forEach(s => { const st = seatEff(s); if (st) m.set(seatKey(st), s); });
  return m;
}
/* Chairs are small, so a seat shows a shortened name — but never an ambiguous one:
   the given name grows one letter at a time until it is unique among namesakes. */
function seatNames(){
  const out = new Map(), bySurname = new Map();
  seatRoster().forEach(s => {
    const p = String(s.name).trim().split(/\s+/);
    const rec = { id: s.id, sur: p[0], given: p.slice(1).join(' ') };
    if (!bySurname.has(rec.sur)) bySurname.set(rec.sur, []);
    bySurname.get(rec.sur).push(rec);
  });
  bySurname.forEach(list => list.forEach(x => {
    if (!x.given) return out.set(x.id, x.sur);
    let n = 1;
    while (n < x.given.length && list.some(y => y !== x && y.given.slice(0, n) === x.given.slice(0, n))) n++;
    out.set(x.id, x.sur + ' ' + x.given.slice(0, n) + (n < x.given.length ? '.' : ''));
  }));
  return out;
}
function seatPlace(id, target){
  const map = seatMap(), from = seatEff(S.singers.find(s => s.id === id));
  const sitting = target ? map.get(seatKey(target)) : null;
  if (sitting && sitting.id !== id) S.seatEdit.set(sitting.id, from || null);   // swap, don't overwrite
  S.seatEdit.set(id, target);
  S.seatSel = null;
}
function seatDelta(){
  const out = [];
  if (!S.seatEdit) return out;
  S.seatEdit.forEach((v, id) => {
    const s = S.singers.find(x => x.id === id);
    if (s && seatKey(seatOf(s)) !== seatKey(v)) out.push({ s, v });
  });
  return out;
}
function seatingPage(){

async function saveSeats(){
  const rows = seatDelta();
  if (!rows.length || !await ensureSession()) return;
  const EMPTY = { seat_block: null, seat_row: null, seat_col: null };
  /* A chair may hold only one person, so vacate every chair involved before
     filling any of them — otherwise a simple swap collides with the singer who
     is still sitting there. If a later write fails the pending moves stay on
     screen and Save can be pressed again: the chairs are already empty. */
  const clear = await sb.from('singers').update(EMPTY).in('id', rows.map(r => r.s.id)).select();
  if (!wrote(clear)) return render();
  rows.forEach(({ s }) => Object.assign(s, EMPTY));
  for (const { s, v } of rows) {
    if (!v) continue;
    const patch = { seat_block: v.b, seat_row: v.r, seat_col: v.c };
    const res = await sb.from('singers').update(patch).eq('id', s.id).select();
    if (!wrote(res)) return render();
    Object.assign(s, patch);
  }
  S.seatEdit = null; S.seatSel = null;
  okToast(t('seatsSaved')); render();
}

/* ---------- choir rules ---------- */
/* The director keeps this as plain text, so the page understands a handful of
   marks: # heading, - / 1. lists, an indented "a." sub-point, ==highlight==
   (the yellow marker of the printed copy), **bold** and > for a quotation. */
function rulesBody(src){
  const inline = s => esc(s).replace(/==([^=]+)==/g, '<mark>$1</mark>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const out = [];
  let list = null;
  const close = () => { if (list) { out.push('</' + list + '>'); list = null; } };
  const open = kind => { if (list !== kind) { close(); out.push('<' + kind + '>'); list = kind; } };
  String(src || '').split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) { close(); return; }
    let m;
    if ((m = line.match(/^#+\s+(.+)/)))      { close(); out.push('<h3>' + inline(m[1]) + '</h3>'); return; }
    if ((m = line.match(/^>\s*(.+)/)))       { close(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>'); return; }
    if ((m = line.match(/^(\d+)\.\s+(.+)/))) { open('ol'); out.push('<li>' + inline(m[2]) + '</li>'); return; }
    if (/^\s{2,}/.test(raw) && (m = line.match(/^([a-zа-я])[.)]\s+(.+)/i))) {
      if (!list) open('ul');
      out.push('<li class="sub">' + inline(m[1] + '. ' + m[2]) + '</li>'); return;
    }
    if ((m = line.match(/^[-*•]\s+(.+)/)))   { open('ul'); out.push('<li>' + inline(m[1]) + '</li>'); return; }
    close(); out.push('<p>' + inline(line) + '</p>');
  });
  close();
  return out.join('');
}

const MDLINE = { h: '# ', ol: '1. ', ul: '- ', sub: '  a. ', quote: '> ' };
function applyMd(kind){
  const box = document.getElementById('rules-edit');
  if (!box) return;
  const v = box.value, a = box.selectionStart, b = box.selectionEnd;
  if (kind === 'mark' || kind === 'bold') {
    const tag = kind === 'mark' ? '==' : '**';
    const sel = v.slice(a, b) || (kind === 'mark' ? t('mdMark') : t('mdBold'));
    box.value = v.slice(0, a) + tag + sel + tag + v.slice(b);
    box.setSelectionRange(a + tag.length, a + tag.length + sel.length);
  } else {
    const pre = MDLINE[kind];
    /* Numbered and lettered lists run past their first item, so the "is it
       already applied?" test has to match any number or letter, not "1." / "a.". */
    const has = kind === 'ol' ? /^\s*\d+[.)]\s+/ : kind === 'sub' ? /^\s*[a-zа-я][.)]\s+/i : null;
    const LETTERS = S.lang === 'ru' ? 'абвгдежзик' : 'abcdefghij';
    let start = v.lastIndexOf('\n', a - 1) + 1;
    let end = v.indexOf('\n', b); if (end === -1) end = v.length;
    const lines = v.slice(start, end).split('\n');
    const off = lines.every(l => !l.trim() || (has ? has.test(l) : l.startsWith(pre)));   // tap again to remove
    let n = 0;
    const next = lines.map(l => {
      if (!l.trim()) return l;
      const bare = l.replace(/^(\s*)(#+\s+|[-*•]\s+|\d+[.)]\s+|[a-zа-я][.)]\s+|>\s*)?/i, '');
      if (off) return bare;
      const mark = kind === 'ol' ? (n + 1) + '. '
                 : kind === 'sub' ? '  ' + (LETTERS[n] || LETTERS[LETTERS.length-1]) + '. '
                 : pre;
      n++;
      return mark + bare;
    }).join('\n');
    box.value = v.slice(0, start) + next + v.slice(end);
    box.setSelectionRange(start, start + next.length);
  }
  if (S.rulesEdit) S.rulesEdit[S.lang] = box.value;
  box.focus();
}
async function saveRules(){
  const box = document.getElementById('rules-edit');    // absent while previewing
  if (!S.rulesEdit || !await ensureSession()) return;
  if (box) S.rulesEdit[S.lang] = box.value;              // whatever is on screen right now
  const patch = { key: 'rules', updated_at: new Date().toISOString() };
  /* Only languages the director actually changed are written, so editing the
     English text can never overwrite the Russian one. */
  if (S.rulesEdit.en !== ((S.rules && S.rules.body_en) || '')) patch.body_en = S.rulesEdit.en;
  if (S.rulesEdit.ru !== ((S.rules && S.rules.body_ru) || '')) patch.body_ru = S.rulesEdit.ru;
  if (patch.body_en === undefined && patch.body_ru === undefined) { S.rulesEdit = null; return render(); }
  const res = await sb.from('documents').upsert(patch, { onConflict: 'key' }).select();
  if (!wrote(res)) return render();
  S.rules = res.data[0]; S.rulesEdit = null; S.rulesPreview = false;
  okToast(t('rulesSaved')); render();
}

function songDates(songId){
  return S.eventSongs.filter(x => x.song_id === songId)
    .map(x => S.events.find(e => e.id === x.event_id))
    .filter(e => e && inRange(e.date, S.from, S.to))
    .sort((a,b) => a.date < b.date ? 1 : -1);

/* Public view of the credits: one row per person, expandable to the songs they
   led. Counts respect the date range, like every other summary here. */
function creditRows(){
  const inSpan = new Map();          // event id -> true, for the current range
  S.events.forEach(e => { if (inRange(e.date, S.from, S.to)) inSpan.set(e.id, e.date); });
  const acc = new Map();             // person id -> {c, p, last, songs:Map}
  const bump = (id, slot, songId, date) => {
    if (!id) return;
    if (!acc.has(id)) acc.set(id, { c: 0, p: 0, last: '', songs: new Map() });
    const a = acc.get(id);
    a[slot]++;
    if (date > a.last) a.last = date;
    a.songs.set(songId, (a.songs.get(songId) || 0) + 1);
  };
  S.eventSongs.forEach(x => {
    const date = inSpan.get(x.event_id);
    if (!date) return;
    bump(x.conductor_id, 'c', x.song_id, date);
    bump(x.pianist_id, 'p', x.song_id, date);
  });
  return [...acc.entries()]
    .map(([id, a]) => ({ person: S.singers.find(s => s.id === id), ...a }))
    .filter(r => r.person)
    .filter(r => S.peopleRole === 'all' ? true : S.peopleRole === 'conductors' ? r.c : r.p)
    .sort((a, b) => (b.c + b.p) - (a.c + a.p) || a.person.name.localeCompare(b.person.name, 'ru'));
}

  const kinds = ['rehearsal','morning','evening','other'];
  const inScope = e => target === 'songs'
    ? (e.kind !== 'rehearsal' || hasSongs(e))
    : (hasAtt(e) || !hasSongs(e));
  const recent = S.events.slice().reverse().filter(inScope).slice(0,4);
  return `<div class="sec"><div class="card">
      <div class="step">${esc(t('date'))}</div>
      <input class="field" type="date" id="draft-date" value="${S.draft.date}">
    </div></div>
    <div class="sec"><div class="card">
      <div class="step">${esc(t('event'))}</div>
      ${kinds.map(k => `<div class="opt ${S.draft.kind===k?'on':''}" data-kind="${k}">
        <div class="dot"></div><div>${esc(t(k))}</div>
        <div class="tag">${esc(k==='other' ? (S.draft.label || '—') : KIND_LABEL[S.lang][k])}</div></div>`).join('')}
      ${S.draft.kind==='other' ? `<div style="display:flex;gap:8px">
        <input class="field" id="draft-name" placeholder="${esc(t('eventName'))}" value="${esc(S.draft.name)}">
        <input class="field" id="draft-label" style="width:96px;flex:none;text-align:center" placeholder="${esc(t('shortLabel'))}" value="${esc(S.draft.label)}">
      </div><div style="font-size:12px;color:var(--faint)">${esc(t('labelHint'))}</div>` : ''}
    </div></div>
    <div class="pad" style="padding:16px 12px 2px"><button class="btn" data-go="${target}">${esc(t(target==='att'?'markAtt':'chooseSongs'))}</button></div>
    <div class="sec"><div class="pad">
      <div class="step" style="margin-bottom:8px">${esc(t('recent'))}</div>
      ${recent.map(e => entryRow(e, target)).join('')}

        ? `<a class="mini" style="display:flex;justify-content:center" href="#/admin/entries/${target}">${esc(t('olderEntries'))}</a>`

    </div></div>
    <div class="sec"><div class="pad" style="${S.exportOpen?'':'padding-bottom:14px'}">
      <button class="step fold" data-export-toggle aria-expanded="${S.exportOpen?'true':'false'}" style="margin-bottom:${S.exportOpen?'8px':'0'}">${esc(t('exportTitle'))}

      ${S.exportOpen ? `<div class="chips" style="padding:0 0 10px">

      </div>
      <div style="display:flex;gap:8px">
        <button class="xbtn" data-export="att">${esc(t('exportAtt'))}</button>
        <button class="xbtn" data-export="songs">${esc(t('exportSongs'))}</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="xbtn" data-backup ${S.backingUp?'disabled':''}>${esc(S.backingUp ? t('loading') : t('backupBtn'))}</button>
      </div>
      <div class="note" style="padding:8px 0 0">${esc(t('backupNote'))}</div>` : ''}
    </div></div>`;
}
function entryRow(e, target){
  const href = '#/admin/' + (target === 'att' ? 'attendance' : 'songs') + '/' + e.id;
  return `<div class="li" style="border:1px solid var(--rule);border-radius:8px;margin-bottom:8px">
    <a href="${href}" style="flex:1;min-width:0;color:inherit">
      <div style="font-variant-numeric:tabular-nums">${esc(fmtLong(e.date))}</div>
      <div style="font-size:13px;color:${e.cancelled?'var(--red)':'var(--muted)'}">${
        esc(e.name || t(e.kind))}${e.cancelled ? ' · ' + esc(t('cancelledEvent')) : ''}</div></a>
    <a class="mini" href="${href}">${esc(t('edit'))}</a>
    <button class="mini danger" data-del-event="${e.id}">${esc(t('del'))}</button></div>`;
}
/* Every entry back to the very first one, newest first, grouped by month.
   Filtered by year and by kind, then paged, so the list stays short enough to
   read on a phone however many years the choir has been going. */
const ENT_PER_PAGE = 25;
function allEntries(target){
  const scope = S.events.filter(e => target === 'songs'
    ? (e.kind !== 'rehearsal' || hasSongs(e))
    : (hasAtt(e) || !hasSongs(e)));
  const years = [...new Set(scope.map(e => e.date.slice(0,4)))].sort().reverse();
  const all = scope.slice().sort((a,b) => a.date < b.date ? 1 : -1)
    .filter(e => S.entYear === 'all' || e.date.slice(0,4) === S.entYear)
    .filter(e => target === 'songs' ? true
      : S.entType === 'all' ? true
      : S.entType === 'services' ? e.kind !== 'rehearsal' : e.kind === 'rehearsal');
  const pages = Math.max(1, Math.ceil(all.length / ENT_PER_PAGE));
  const page = Math.min(S.entPage, pages - 1);
  const rows = all.slice(page * ENT_PER_PAGE, (page + 1) * ENT_PER_PAGE);
  let month = '';
  const controls = `<div class="ctlbar">
      ${target === 'songs' ? '' : `<div class="seg tiny">${[['all','all'],['services','services'],['rehearsals','rehearsals']].map(([v,l]) =>
        `<button data-ent-type="${v}" class="${S.entType===v?'on':''}">${esc(t(l))}</button>`).join('')}</div>`}
      <div class="chips">${[['all', t('allYears')], ...years.map(y => [y, y])].map(([v,l]) =>
        `<button data-ent-year="${v}" class="${S.entYear===v?'on':''}">${esc(l)}</button>`).join('')}</div>
    </div>`;
  const pager = pages > 1 ? `<div class="pager">
      <button class="mini" data-ent-page="${page-1}" ${page===0?'disabled':''}>${esc(t('prevPage'))}</button>
      <div class="pg">${esc(t('ofPages')(page+1, pages))}</div>
      <button class="mini" data-ent-page="${page+1}" ${page>=pages-1?'disabled':''}>${esc(t('nextPage'))}</button>
    </div>` : '';
  return `<div class="h"><a class="back" href="#/admin/${target==='att'?'attendance':'songs'}">‹</a>
      ${esc(t('allEntries'))}<span class="n">${esc(t('showingN')(rows.length, all.length))}</span></div>` +
    controls +
    (rows.length ? `<div class="pad">` + rows.map(e => {
        const k = monthKey(e.date), head = k === month ? '' : `<div class="step" style="margin:14px 0 8px">${esc(k)}</div>`;
        month = k;
        return head + entryRow(e, target);
      }).join('') + '</div>' + pager
    : `<div class="msg">${esc(t('noEntries'))}</div>`);
}
/* Marking pages are buffered: taps change S.edit only, Save writes the diff.
   That way nothing reaches the database until the director says so, and no
   empty events are left behind by someone just looking around. */
function editFor(mode, ev){
  const key = mode + ':' + ev.id;
  if (!S.edit || S.edit.key !== key) {
    const base = new Map();
    if (ev.id !== 'new') {
      if (mode === 'att') S.absences.filter(a => a.event_id === ev.id)
        .forEach(a => base.set(a.singer_id, a.status === 'not_listed' ? 'na' : 'absent'));
      else songsFor(ev.id).forEach((s, i) => {
        const r = songRow(ev.id, s.id) || {};
        base.set(s.id, { pos: i + 1, c: r.conductor_id || '', p: r.pianist_id || '' });
      });
    }
    S.edit = { key, mode, evId: ev.id, base, sel: new Map(base),
               wasCancelled: !!ev.cancelled, cancelled: !!ev.cancelled };
  }
  return S.edit;
}
/* songs: value is {pos, c, p}; attendance: value is 'absent' | 'na' */
const selPos = v => (v && typeof v === 'object') ? v.pos : v;
const orderedSel = () => [...S.edit.sel.entries()].sort((a,b) => selPos(a[1]) - selPos(b[1])).map(e => e[0]);
function renumber(){
  const cur = S.edit.sel;
  S.edit.sel = new Map(orderedSel().map((k, i) => {
    const v = cur.get(k);
    return [k, { pos: i + 1, c: (v && v.c) || '', p: (v && v.p) || '' }];
  }));
}
const sameSel = (a, b) => (a && typeof a === 'object' && b && typeof b === 'object')
  ? (a.pos === b.pos && a.c === b.c && a.p === b.p) : a === b;
function dateBadge(ev){
  const E = S.edit, cur = (E && E.newDate) || ev.date;
  if (ev.id === undefined || E.evId === 'new') return esc(fmtLong(cur));
  return `${esc(fmtLong(cur))}<label class="dpick hdr" title="${esc(t('changeDate'))}" aria-label="${esc(t('changeDate'))}">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    <input type="date" value="${cur}" data-move-date></label>`;
}
function editDelta(){
  const e = S.edit; if (!e) return { del: [], ins: [], n: 0 };
  const del = [], ins = [];
  new Set([...e.base.keys(), ...e.sel.keys()]).forEach(k => {
    const b = e.base.get(k), s = e.sel.get(k);
    if (sameSel(b, s)) return;
    if (b) del.push(k);          // row exists and must go or change
    if (s) ins.push([k, s]);
  });
  return { del, ins, n: new Set([...del, ...ins.map(i => i[0])]).size };
}
const isAttCancelled = E => E.mode === 'att' && E.cancelled;
function editDirty(){
  const E = S.edit;
  if (!E) return false;
  if (E.evId === 'new' || E.cancelled !== E.wasCancelled) return true;
  if (E.newDate) return true;
  return !isAttCancelled(E) && editDelta().n > 0;
}
function saveBar(mode){
  const isNew = S.edit && S.edit.evId === 'new', dirty = editDirty();
  const n = isAttCancelled(S.edit) ? S.edit.base.size : editDelta().n;
  const status = isNew ? t('newEntry') : dirty ? t('unsavedN')(Math.max(n, 1)) : t('noChanges');
  return `<div class="note">${esc(t('autosave'))}</div>
    <div class="savebar">
      <div class="st ${dirty ? 'live' : ''}">${esc(status)}</div>
      <button class="sb ghost" data-cancel-marks="${mode}">${esc(t('cancel'))}</button>
      <button class="sb go" data-save-marks ${dirty ? '' : 'disabled'}>${esc(t('save'))}</button>
    </div>`;
}
function markAttendance(ev){
  const E = editFor('att', ev);
  const n = E.cancelled ? 0 : [...E.sel.values()].filter(v => v === 'absent').length;
  const cancelCard = `<div class="pad">
      <button class="btn ${E.cancelled ? '' : 'ghost'}" data-toggle-cancel>${
        esc(E.cancelled ? t('unmarkCancelled') : t('markCancelled'))}</button>
      ${E.cancelled ? `<div class="note" style="padding:10px 0 0">${esc(t('cancelledNote'))}</div>` : ''}
    </div>`;
  /* The date in the header is editable for an existing entry: tap it, pick a
     new day, and Save moves the whole entry (attendance and songs alike). */
  return `<div class="h"><button class="back" data-cancel-marks="att">‹</button>
      ${dateBadge(ev)} <span class="n" style="color:var(--red)">${n}</span>
      <span style="font-size:13px;color:var(--muted)">${esc(t('absentN'))}</span></div>` +
    cancelCard +
    (E.cancelled ? '' : `<div class="sec">` + PARTS.map(p => {
      const rows = S.singers.filter(s => s.part === p && s.active !== false);
      if (!rows.length) return '';
      return `<div class="sectbar">${esc(t(p))}</div>` + rows.map(s => {
        const st = E.sel.get(s.id) || 'present';
        return `<div class="li tap ${st==='absent'?'off':st==='na'?'na':''}" data-toggle-absent="${s.id}" data-event="${ev.id}">
          <div class="nm">${esc(s.name)}</div>
          <div class="pill">${esc(st==='absent' ? t('wasAbsent') : st==='na' ? t('wasNA') : t('wasPresent'))}</div></div>`;
      }).join('');
    }).join('') + `</div>` +
    `<div class="note">${esc(t('tapHint'))}</div>`) +
    saveBar('att');
}
/* optional per-song credit. Empty is a legitimate answer, so no default. */
function who(slot, songId, people, label){
  const v = (S.edit.sel.get(songId) || {})[slot] || '';
  return `<label class="cr"><em>${esc(label)}</em>
    <select data-credit="${slot}:${songId}">
      <option value="">${esc(t('noneSet'))}</option>
      ${people.map(({p}) => `<option value="${p.id}" ${v===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select></label>`;
}
/* Its own section, so the running order above stays a plain list. */
function creditsCard(){
  const ids = orderedSel();
  if (!ids.length) return '';
  if (!conductors().length && !pianists().length)
    return `<div class="sec"><div class="sectbar">${esc(t('credits'))}<em>${esc(t('optional'))}</em></div>
      <div class="note">${esc(t('noRolesYet'))}</div></div>`;
  return `<div class="sec"><div class="sectbar">${esc(t('credits'))}<em>${esc(t('optional'))}</em></div>` +
    ids.map((id, i) => {
      const s = S.songs.find(x => x.id === id); if (!s) return '';
      return `<div class="crow">
        <div class="ct"><span>${i + 1}</span>${esc(s.title)}</div>
        <div class="cf">
          ${who('c', id, conductors(), t('conductor'))}
          ${who('p', id, pianists(), t('pianist'))}
        </div></div>`;
    }).join('') + `</div>`;
}
function orderCard(){
  const ids = orderedSel();
  if (!ids.length) return '';
  return `<div class="sec"><div class="sectbar">${esc(t('order'))}</div>` +
    ids.map((id, i) => {
      const s = S.songs.find(x => x.id === id); if (!s) return '';
      return `<div class="li"><div class="ord">${i + 1}</div>
        <div style="flex:1;min-width:0"><div style="font-size:15px;line-height:1.2">${esc(s.title)}</div>
        ${s.subtitle ? `<div class="sub">${esc(s.subtitle)}</div>` : ''}</div>
        <div class="acts">
          <button class="mini icon" data-move="up:${id}" ${i === 0 ? 'disabled' : ''} aria-label="${esc(t('up'))}">↑</button>
          <button class="mini icon" data-move="down:${id}" ${i === ids.length - 1 ? 'disabled' : ''} aria-label="${esc(t('down'))}">↓</button>
        </div></div>`;
    }).join('') +
    `<div class="note">${esc(t('orderHint'))}</div></div>`;
}
function markSongs(ev){
  const E = editFor('songs', ev);
  const picked = E.sel.size;
  const list = S.songs.filter(s => s.active !== false &&
    (!S.query || s.title.toLowerCase().includes(S.query.toLowerCase())));
  /* A 160-song list is a long scroll past the running order, so it folds itself
     away once three songs are picked. S.pickOpen overrides in both directions. */
  const open = S.pickOpen === null ? picked < 3 : S.pickOpen;
  const chooser = `<button class="fold ${open?'open':''}" data-toggle-pick>
      <span>${esc(t('chooseFrom'))}</span>
      <em>${open ? esc(t('hideList')) : esc(t('showList')(list.length))} ${open?'▴':'▾'}</em>
    </button>` +
    (open ? `<div class="card">${qField()}</div>` +
      list.map(s => {
        const on = E.sel.has(s.id);
        return `<div class="li tap ${on?'on':''}" data-toggle-song="${s.id}" data-event="${ev.id}">
          <div class="box">${on ? E.sel.get(s.id).pos : ''}</div>
          <div style="flex:1;min-width:0"><div style="font-size:16px;line-height:1.2">${esc(s.title)}</div>
          ${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}</div>
          <div style="font-size:14px;color:var(--muted)">${songStats(s.id).n}</div></div>`;
      }).join('') : '');
  const prev = picked ? null : S.events
    .filter(x => x.kind !== 'rehearsal' && !x.cancelled && x.id !== ev.id && hasSongs(x) && x.date <= ev.date)
    .slice().sort((a,b) => a.date < b.date ? 1 : -1)[0];
  const copyBtn = prev ? `<div class="pad" style="padding-bottom:0">
      <button class="btn ghost" data-copy-last="${prev.id}">${esc(t('copyLast'))} · ${esc(fmtShort(prev.date))}</button>
    </div>` : '';
  return `<div class="h"><button class="back" data-cancel-marks="songs">‹</button>
      ${dateBadge(ev)} <span class="n" style="color:var(--blue)">${picked}</span>
      <span style="font-size:13px;color:var(--muted)">${esc(t('selected'))}</span></div>` +
    copyBtn + `<div class="sec">` + chooser + `</div>` + orderCard() + creditsCard() +
    saveBar('songs');
}

      <i>${open ? '–' : '+'}</i>${esc(t(open ? 'cancel' : (label || 'add')))}</button>` +
    (open ? `<div class="card" style="border-top:1px solid var(--rule)">${inner}</div>` : '');
}

/* ---------- CSV export ---------- */
function download(name, text){
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

/* Full-database backup: every table, paged past PostgREST's 1000-row cap. */
async function fullBackup(){
  S.backingUp = true; render();
  try {
    const dump = { exported_at: new Date().toISOString(), app: document.title, tables: {} };
    for (const tbl of ['singers','events','songs','song_categories','absences','event_songs']) {
      const rows = [];
      for (let fromRow = 0;;) {
        const { data, error } = await sb.from(tbl).select('*').range(fromRow, fromRow + 999);
        if (error) throw error;
        rows.push(...data);
        if (data.length < 1000) break;
        fromRow += 1000;
      }
      dump.tables[tbl] = rows;
    }
    const stamp = today();
    const url = URL.createObjectURL(new Blob([JSON.stringify(dump, null, 1)], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = 'choir-backup-' + stamp + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) { S.toast = t('backupFail'); }
  S.backingUp = false; render();
}

function exportCSV(kind){
  const xf = S.exportPreset === 'all' ? EPOCH : shift(+S.exportPreset);   // export has its own period
  const ev = S.events.filter(kind === 'att' ? hasAtt : hasSongs)
    .filter(e => inRange(e.date, xf, today()))
    .slice().sort((a,b) => a.date < b.date ? -1 : 1);
  if (kind === 'att') {
    const head = ['singer','part', ...ev.map(e => e.date + ' ' + evLabel(e))];
    const rows = PARTS.flatMap(p => S.singers.filter(s => s.part === p && s.active !== false).map(s =>
      [s.name, p, ...ev.map(e => { if (e.cancelled) return 'Cancelled';
        const st = attStatus(e.id, s.id);
        return st === 'absent' ? 'Absent' : st === 'na' ? 'Not Listed' : 'Present'; })]));
    download('attendance-' + S.from + '_' + S.to + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  } else {
    const head = ['date','event','no','song','subtitle'];

    ev.forEach(e => songsFor(e.id).forEach((s, i) => {
      rows.push([e.date, e.name || e.kind, i + 1, s.title, s.subtitle]);
    }));
    download('songs-' + S.from + '_' + S.to + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  }
}

  const r = S.route;

     on screen, leave those exact nodes alone unless something visible changed. */

    const sig = S.lang + '|' + (S.error || '') + '|' + (S.session ? '1' : '0') + '|' + (S.menuOpen ? '1' : '0');

  if (r.startsWith('#/admin')) {

      <a href="#/songs/services" class="${tab==='services'?'on':''}">${esc(t('byService'))}</a>

    else html += songsGrid(songTabs + rangeCtrl('grid')
      + `<div class="searchrow" style="display:flex;gap:8px">${qField()}${catSelect()}</div>`);
  }

    const tab = r.split('/')[2] || 'grid';

/* Size the grid to the space actually left below it. Measuring must not disturb
   the box: clearing maxHeight first would remove the overflow, reset scrollTop,
   change the page height and re-trigger this through the viewport listener. */
let fitPending = false;
function fitGrid(){
  /* Tapping a chair re-renders the stage, so put the sideways scroll back where
     the reader had it instead of snapping to the far left. */
  const st = document.querySelector('.stagewrap');
  if (st) {
    const skey = S.seatPart + '|' + S.seatView;
    if (S.stageKey !== skey) {
      /* Open on the aisle between the two block columns — the real middle of the
         stage — rather than the far left or the midpoint of unequal blocks. */
      S.stageKey = skey;
      const al = st.querySelector('.blk.al');
      const aisle = al ? al.getBoundingClientRect().right - st.getBoundingClientRect().left + st.scrollLeft + 6
                       : st.scrollWidth / 2;
      const max = st.scrollWidth - st.clientWidth;
      S.stageLeft = Math.min(max, Math.max(0, Math.round(aisle - st.clientWidth / 2)));
      st.scrollLeft = S.stageLeft;
    }
    else if (S.stageLeft) st.scrollLeft = S.stageLeft;
    st.addEventListener('scroll', () => { S.stageLeft = st.scrollLeft; }, { passive: true });
  }
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  let below = 0;
  for (let n = sc.nextElementSibling; n; n = n.nextElementSibling) {
    if (getComputedStyle(n).position === 'fixed') continue;

  }

  /* Measure from the top of the PAGE, not the top of the screen: using the on-screen
     position meant a page that had already scrolled produced a taller grid, which made
     the page scroll further — on an iOS home-screen app that ran away until the header
     was unreachable. */
  const docTop = sc.getBoundingClientRect().top + window.scrollY;
  const room = Math.max(220, vh - docTop - below - 2);

// keep the newest dates in view: jump the grid to its right edge when the page changes
async function signIn(){
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  if (!email || !password) return;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { S.error = error.message; return render(); }
  S.session = data.session; S.error = ''; location.hash = '#/admin/attendance';
}
function afterRender(){
  const lf = document.getElementById('loginform');
  if (lf && !lf.dataset.wired) {
    lf.dataset.wired = '1';
    lf.addEventListener('submit', e => { e.preventDefault(); signIn(); });
  }
  /* Tapping a chair re-renders the stage, so put the sideways scroll back where
     the reader had it instead of snapping to the far left. */
  const st = document.querySelector('.stagewrap');
  if (st) {
    const skey = S.seatPart + '|' + S.seatView;
    if (S.stageKey !== skey) {
      /* Open on the aisle between the two block columns — the real middle of the
         stage — rather than the far left or the midpoint of unequal blocks. */
      S.stageKey = skey;
      const al = st.querySelector('.blk.al');
      const aisle = al ? al.getBoundingClientRect().right - st.getBoundingClientRect().left + st.scrollLeft + 6
                       : st.scrollWidth / 2;
      const max = st.scrollWidth - st.clientWidth;
      S.stageLeft = Math.min(max, Math.max(0, Math.round(aisle - st.clientWidth / 2)));
      st.scrollLeft = S.stageLeft;
    }
    else if (S.stageLeft) st.scrollLeft = S.stageLeft;
    st.addEventListener('scroll', () => { S.stageLeft = st.scrollLeft; }, { passive: true });
  }
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  fitGrid();
  const key = S.route + '|' + S.from + '|' + S.to + '|' + S.typeFilter;
  // innerHTML rebuilds the grid, so scroll position has to be re-applied every render:
  // jump to the newest dates when the page or range changes, otherwise stay put.
  if (S.scrollKey !== key) { S.scrollKey = key; sc.scrollLeft = sc.scrollWidth; }
  else if (S.scrollLeft) { sc.scrollLeft = S.scrollLeft; }

  sc.addEventListener('scroll', () => { S.scrollLeft = sc.scrollLeft; }, { passive: true });
}

/* An expired access token is rejected by row-level security with no error object —
   the write simply affects nothing. Refresh before every admin write, and treat
   "zero rows changed" as a lost session rather than a success. */
async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.session = null; render(); return false; }
  if ((session.expires_at || 0) * 1000 - Date.now() < 60000) {
    const { data, error } = await sb.auth.refreshSession();
    if (error || !data.session) {
      // The stored token is dead. Clear it locally, or every later call retries
      // it and Supabase logs another "Invalid Refresh Token".
      await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      S.session = null; location.hash = '#/login'; return false;
    }
    S.session = data.session;
  }
  return true;
}

function wrote(res){
  if (res.error) { fail(res.error); return false; }
  if (Array.isArray(res.data) && res.data.length === 0) {
    fail({ message: t('sessionLost') });
    S.session = null;
    return false;
  }
  return true;
}

  }

  if (d.savePerson) {
    const s = S.singers.find(x => x.id === d.savePerson);
    const inp = document.getElementById('edit-name');
    const clean = inp ? inp.value.trim() : '';
    if (!s || !clean) return;
    if (!await ensureSession()) return;
    const jd = document.getElementById('edit-joined');   // absent on the role tabs
    const patch = { name: clean };
    if (jd) patch.joined_on = jd.value || null;
    const res = await sb.from('singers').update(patch).eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.name = clean;
    if (jd) s.joined_on = patch.joined_on;
    S.editPerson = null; return render();
  }
  if (el.hasAttribute('data-cancel-person')) { S.editPerson = null; return render(); }
  if (d.archiveSinger) {
    const s = S.singers.find(x => x.id === d.archiveSinger);
    if (!s) return;
    if (!await ensureSession()) return;
    const next = s.active === false;               // true = restore
    const res = await sb.from('singers').update({ active: next }).eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.active = next; S.editPerson = null; return render();
  }
  if (d.saveSongRow) {
    const s = S.songs.find(x => x.id === d.saveSongRow);
    const tt = document.getElementById('edit-song-title'), ss = document.getElementById('edit-song-sub');
    const clean = tt ? tt.value.trim() : '';
    if (!s || !clean) return;
    if (!await ensureSession()) return;
    const subtitle = (ss && ss.value.trim()) || null;
    const cs = document.getElementById('edit-song-cat');
    const category_id = cs ? (cs.value || null) : (s.category_id || null);
    const res = await sb.from('songs').update({ title: clean, subtitle, category_id }).eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.title = clean; s.subtitle = subtitle; s.category_id = category_id;
    S.songs.sort((a,b) => a.title.localeCompare(b.title));
    S.editSongRow = null; return render();
  }
  if (el.hasAttribute('data-cancel-song-row')) { S.editSongRow = null; return render(); }
  if (d.copyLast && S.edit) {                      // prefill from the previous service
    const rows = S.eventSongs.filter(x => x.event_id === d.copyLast)
      .slice().sort((a,b) => (a.position ?? 9999) - (b.position ?? 9999));
    S.edit.sel = new Map(rows.map((x,i) => [x.song_id, { pos: i+1, c: x.conductor_id || '', p: x.pianist_id || '' }]));
    S.pickOpen = null;
    return render();
  }
  if (el.hasAttribute('data-clear-q')) {
    S.query = ''; render();
    const fq = document.getElementById('q'); if (fq) fq.focus();
    return;
  }
  if (d.gotoSong) { S.openSong = d.gotoSong; location.hash = '#/songs/summary'; return; }
  if (el.hasAttribute('data-notes')) {
    e.preventDefault();
    S.showNotes = !S.showNotes;
    render();
    if (S.showNotes) {                       // bring the panel into view, it sits below the fold
      const p = document.querySelector('.notespanel');
      if (p) window.scrollTo({ top: window.scrollY + p.getBoundingClientRect().bottom - window.innerHeight + 24, behavior: 'smooth' });
    }
    return;
  }
  if (el.hasAttribute('data-export-toggle')) { S.exportOpen = !S.exportOpen; return render(); }
  if (d.exportPreset) { S.exportPreset = d.exportPreset; return render(); }
  if (d.addOpen) { S.addOpen = S.addOpen === d.addOpen ? null : d.addOpen; return render(); }
  if (el.hasAttribute('data-toggle-cats')) { S.showCats = !S.showCats; return render(); }
  if (el.hasAttribute('data-add-cat')) {
    const inp = document.getElementById('new-cat-name');
    const name = inp ? inp.value.trim() : '';
    if (!name) return;
    if (!await ensureSession()) return;
    const { data, error } = await sb.from('song_categories').insert({ name }).select().single();
    if (error) return fail(error);
    if (inp) inp.value = '';
    S.categories.push(data);
    S.categories.sort((a,b) => a.name.localeCompare(b.name, 'ru'));
    return render();
  }
  if (d.editCat) { S.editCat = S.editCat === d.editCat ? null : d.editCat; return render(); }
  if (el.hasAttribute('data-cancel-cat')) { S.editCat = null; S.addOpen = null; return render(); }
  if (d.saveCat) {
    const c = S.categories.find(x => x.id === d.saveCat);
    const inp = document.getElementById('edit-cat-name');
    const name = inp ? inp.value.trim() : '';
    if (!c || !name) return;
    if (!await ensureSession()) return;
    const res = await sb.from('song_categories').update({ name }).eq('id', c.id).select();
    if (!wrote(res)) return render();
    c.name = name; S.editCat = null; S.addOpen = null;
    S.categories.sort((a,b) => a.name.localeCompare(b.name, 'ru'));
    return render();
  }
  if (d.delCat) {
    if (!confirm(t('deleteCat'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('song_categories').delete().eq('id', d.delCat).select();
    if (!wrote(res)) return render();
    S.categories = S.categories.filter(x => x.id !== d.delCat);
    S.songs.forEach(s => { if (s.category_id === d.delCat) s.category_id = null; });
    if (S.catFilter === d.delCat) S.catFilter = 'all';
    return render();
  }
  if (el.hasAttribute('data-signout')) { await sb.auth.signOut(); S.session = null; location.hash = '#/home'; return; }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.setPart) {
    const s = S.singers.find(x => x.id === el.dataset.setPart);
    const was = s.part, next = el.value;
    if (!s || was === next) return;
    if (!await ensureSession()) { el.value = was; return; }
    s.part = next;                              // optimistic: the row jumps sections at once
    render();
    const res = await sb.from('singers').update({ part: next }).eq('id', s.id).select();
    if (!wrote(res)) { s.part = was; render(); }
    else okToast(t('partMoved')(s.name, t(next)));
    return;
  }
  if (el.hasAttribute('data-cat-filter')) { S.catFilter = el.value; return render(); }
  if (el.dataset.credit && S.edit) {
    const [slot, songId] = el.dataset.credit.split(':');
    const v = S.edit.sel.get(songId);
    if (v) { S.edit.sel.set(songId, Object.assign({}, v, { [slot]: el.value })); render(); }
    return;
  }
  if (el.dataset.markRole) {                    // give an existing person the role
    const role = el.dataset.markRole, id = el.value;
    if (!id) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').update({ [role]: true }).eq('id', id).select();
    if (!wrote(res)) return render();
    const p = S.singers.find(x => x.id === id);
    if (p) p[role] = true;
    return render();
  }
  if (el.dataset.upload) {
    const song = S.songs.find(s => s.id === el.dataset.upload);
    const file = el.files && el.files[0];
    if (!song || !file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { alert(t('pdfOnly')); return; }
    const kind = el.dataset.sheetKind || 'sheets', K = SHEETKIND[kind];
    const old = song[K.col];
    const path = sheetPath(song[K.lock], song.id);
    el.value = '';                        // so picking the same file again still fires
    S.uploading = kind + ':' + song.id; render();
    const up = await sb.storage.from(K.bucket).upload(path, file, { contentType: 'application/pdf' });
    if (up.error) { S.uploading = null; return fail(up.error); }
    const { error } = await sb.from('songs').update({ [K.col]: path }).eq('id', song.id);
    if (error) { S.uploading = null; await sb.storage.from(K.bucket).remove([path]); return fail(error); }
    song[K.col] = path;
    if (old) await sb.storage.from(K.bucket).remove([old]);
    S.uploading = null; return render();
  }
  if (el.dataset.range) {
    const v = el.value;
    S.preset = null; S.rangeSet = true;
    if (el.dataset.edge === 'from') S.from = v; else S.to = v;
    render();
  }
});
document.addEventListener('change', e => {
  if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-move-date') && S.edit) {
    if (e.target.value) { S.edit.newDate = e.target.value; render(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.query = e.target.value;
    const pos = e.target.selectionStart; render();
    const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.menuOpen) { S.menuOpen = false; document.body.classList.remove('mlock'); render(); }
});
window.addEventListener('hashchange', () => {
  requestAnimationFrame(() => {          // after the route handler paints the new page
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const app = document.getElementById('app');
    if (!app) return;
    const kids = [...app.children];
    const di = kids.findIndex(k => k.classList && k.classList.contains('drawer'));
    kids.slice(di + 1).forEach(k => k.animate &&
      k.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:220,easing:'cubic-bezier(.2,.7,.3,1)'}));
    [...app.querySelectorAll('.tiles .tile')].slice(0, 9).forEach((tl, i) => tl.animate &&
      tl.animate([{opacity:0,transform:'translateY(14px) scale(.985)'},{opacity:1,transform:'none'}],
        {duration:340,delay:60 + i * 45,easing:'cubic-bezier(.2,.7,.3,1)',fill:'backwards'}));
  });
});
window.addEventListener('hashchange', () => {
  S.route = location.hash || '#/home';
  S.menuOpen = false;
  document.body.classList.remove('mlock');
  if (!/^#\/admin\/(attendance|songs)\/.+/.test(S.route)) { S.edit = null; S.pending = null; }
  if (!S.route.startsWith('#/seating')) { S.seatEdit = null; S.seatSel = null; }
  if (!S.route.startsWith('#/rules')) { S.rulesEdit = null; S.rulesPreview = false; }
  S.error = ''; S.query = ''; S.editPerson = null; S.editSongRow = null; S.editCat = null; S.addOpen = null;
  render();
});

/* ---------- boot ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('online', () => { if (S.toast) { S.toast = ''; render(); } load(true); });
S.from = shift(6); S.to = today();
let wasWide = isWide();
window.addEventListener('resize', () => { if (isWide() !== wasWide) { wasWide = isWide(); render(); } });
const { data: { session } } = await sb.auth.getSession();
S.session = session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; render(); });
// iOS suspends a home-screen app rather than closing it: the token can be hours
// stale when it comes back. Refresh it, and re-read the data, on return.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.session) await ensureSession();
  load(true);
});
await load();
</script>
</body>
</html>
