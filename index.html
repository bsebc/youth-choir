const MON = { en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
              ru:['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'] };
const MONF = { en:['January','February','March','April','May','June','July','August','September','October','November','December'],
               ru:['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'] };
const PARTS = ['soprano','alto','tenor','bass'];
const KIND_LABEL = { en:{rehearsal:'R',morning:'M',evening:'E'}, ru:{rehearsal:'Сп',morning:'Ут',evening:'Вч'} };
const evLabel = e => e.kind === 'other' ? e.label : KIND_LABEL[S.lang][e.kind];

const S = {
  lang: localStorage.getItem('bsebc-youth-lang') || 'en',
  session: null,
  route: location.hash || '#/home',
  loading: true,
  error: '',
  singers: [], songs: [], events: [], absences: [], eventSongs: [],
  uploading: null,
  from: null, to: null,           // public grid range
  sumFrom: null, sumTo: null,     // summary range
  typeFilter: 'all',
  preset: { grid: '2', sum: '6' },
  query: '',
  draft: { date: today(), kind: 'morning', name: '', label: '' },
  pending: null,                  // event being created, not written yet
  edit: null                      // buffered marks for the page being edited
};
const t = k => { const v = STR[S.lang][k]; return typeof v === 'function' ? v : v; };
const isWide = () => window.innerWidth >= 900;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- dates ---------- */
function today(){ return new Date().toISOString().slice(0,10); }
function shift(months){ const d = new Date(); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0,10); }
function fmtLong(iso){ const [y,m,d] = iso.split('-').map(Number);
  return S.lang === 'en' ? MONF.en[m-1] + ' ' + d + ', ' + y : d + ' ' + MONF.ru[m-1] + ' ' + y; }
function fmtShort(iso){ const [y,m,d] = iso.split('-');
  return m + '/' + d + '/' + y.slice(2); }   // numeric dates stay mm/dd/yy in both languages
function monthKey(iso){ const [y,m] = iso.split('-').map(Number); return MON[S.lang][m-1] + ' ' + String(y).slice(2); }

/* ---------- data ---------- */
async function load(silent){
  if (!silent) { S.loading = true; render(); }
  const [si, so, ev, ab, es] = await Promise.all([
    sb.from('singers').select('*').order('part').order('sort_order'),
    sb.from('songs').select('*').order('title'),
    sb.from('events').select('*').order('date'),
    sb.from('absences').select('*'),
    sb.from('event_songs').select('*')
  ]);
  const err = [si,so,ev,ab,es].find(r => r.error);
  S.error = err ? err.error.message : '';
  S.singers = si.data || []; S.songs = so.data || []; S.events = ev.data || [];
  S.absences = ab.data || []; S.eventSongs = es.data || [];
  S.loading = false; render();
}

const isAbsent = (e,s) => S.absences.some(a => a.event_id === e && a.singer_id === s);
const wasSung  = (e,s) => S.eventSongs.some(x => x.event_id === e && x.song_id === s);
const inRange  = (d,a,b) => d >= a && d <= b;

function gridEvents(){
  return S.events.filter(e => inRange(e.date, S.from, S.to))
    .filter(e => S.typeFilter === 'all' ? true
      : S.typeFilter === 'services' ? e.kind !== 'rehearsal' : e.kind === 'rehearsal');
}
function songStats(id, from, to){
  const rows = S.eventSongs.filter(x => {
    if (x.song_id !== id) return false;
    if (!from) return true;
    const e = S.events.find(y => y.id === x.event_id);
    return e && inRange(e.date, from, to);
  });
  const dates = rows.map(r => (S.events.find(e => e.id === r.event_id) || {}).date).filter(Boolean).sort();
  return { n: rows.length, last: dates.length ? fmtShort(dates[dates.length-1]) : '' };
}

/* ---------- public: attendance ---------- */
function attendanceGrid(){
  const ev = gridEvents();
  const months = [];
  ev.forEach(e => { const k = monthKey(e.date); const last = months[months.length-1];
    if (last && last.k === k) last.n++; else months.push({k, n:1}); });
  const head = `<div class="row hmonth"><div class="spacer"></div>${
      months.map(m => `<div class="m" style="width:calc(var(--cell) * ${m.n})">${esc(m.k)}</div>`).join('')
    }<div class="tail" style="height:26px;background:#f4f5f1"></div></div>
    <div class="row hday"><div class="spacer">${esc(t('singer'))}</div>${
      ev.map(e => `<div class="d ${e.kind!=='rehearsal'?'svc':''}"><span>${+e.date.slice(8,10)}</span><em>${esc(evLabel(e))}</em></div>`).join('')
    }<div class="tail" style="height:40px;border-bottom:2px solid var(--ink)"></div></div>`;

  const body = PARTS.map(p => {
    const rows = S.singers.filter(s => s.part === p && s.active !== false);
    if (!rows.length) return '';
    return `<div class="sect"><div class="lbl">${esc(t(p))}</div><div class="fill">${esc(t('singersN')(rows.length))}</div></div>` +
      rows.map(s => {
        const cells = ev.map(e => `<div class="cell ${e.kind!=='rehearsal'?'svc':''}">${isAbsent(e.id, s.id) ? esc(S.lang==='en'?'A':'Н') : ''}</div>`).join('');
        const miss = ev.filter(e => isAbsent(e.id, s.id)).length;
        return `<div class="row"><div class="name">${esc(s.name)}</div>
          <div class="tally ${miss>3?'low':''}">${ev.length - miss}/${ev.length}</div>${cells}<div class="tail"></div></div>`;
      }).join('');
  }).join('');

  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  return `<div class="scroll"><div class="gwrap">${head}${body}</div></div>
    <div class="legend">
      <span><i style="background:#fff"></i> ${esc(t('present'))}</span>
      <span><i>${S.lang==='en'?'A':'Н'}</i> ${esc(t('absent'))}</span>
      <span><i style="background:#e7ebf5"></i> ${esc(t('service'))}</span>
    </div>
    <div class="legend" style="padding-top:0">${esc(t('labels'))}</div>`;
}
function attendanceSummary(){
  const ev = S.events.filter(e => inRange(e.date, S.sumFrom, S.sumTo));
  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  return PARTS.map(p => {
    const rows = S.singers.filter(s => s.part === p && s.active !== false);
    if (!rows.length) return '';
    return `<div class="sectbar">${esc(t(p))}</div>` + rows.map(s => {
      const miss = ev.filter(e => isAbsent(e.id, s.id)).length;
      const pct = Math.round((ev.length - miss) / ev.length * 100);
      return `<div class="li"><div style="width:44%;font-size:15px">${esc(s.name)}</div>
        <div class="bar"><i style="width:${pct}%;background:${pct>=85?'var(--blue)':pct>=70?'var(--gold)':'var(--red)'}"></i></div>
        <div class="pct" style="color:${pct>=70?'var(--ink)':'var(--red)'}">${pct}%</div></div>`;
    }).join('');
  }).join('');
}

/* ---------- public: songs ---------- */
function songsGrid(){
  const ev = S.events.filter(e => e.kind !== 'rehearsal' && inRange(e.date, S.from, S.to));
  const songs = S.songs.filter(s => s.active !== false &&
    (!S.query || s.title.toLowerCase().includes(S.query.toLowerCase())));
  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  const months = [];
  ev.forEach(e => { const k = monthKey(e.date); const last = months[months.length-1];
    if (last && last.k === k) last.n++; else months.push({k, n:1}); });
  const head = `<div class="row hmonth srow hd"><div class="spacer"></div>${
      months.map(m => `<div class="m" style="width:calc(var(--cell) * ${m.n})">${esc(m.k)}</div>`).join('')
    }<div class="tail" style="height:26px;background:#f4f5f1"></div></div>
    <div class="row hday srow hd"><div class="spacer">${esc(t('song'))}</div>${
      ev.map(e => `<div class="d svc"><span>${+e.date.slice(8,10)}</span><em>${esc(evLabel(e))}</em></div>`).join('')
    }<div class="tail" style="height:40px;border-bottom:2px solid var(--ink)"></div></div>`;
  const body = songs.map(s => {
    const st = songStats(s.id);
    return `<div class="row srow"><div class="name">${esc(s.title)}${s.subtitle?`<span class="sub">${esc(s.subtitle)}</span>`:''}</div>
      <div class="tally">${st.n}</div>${
      ev.map(e => `<div class="cell svc">${wasSung(e.id, s.id) ? '<i class="sq"></i>' : ''}</div>`).join('')
    }<div class="tail"></div></div>`;
  }).join('');
  return `<div class="scroll"><div class="gwrap">${head}${body}</div></div>
    <div class="legend"><span><i style="background:var(--ink);border:0"></i> ${esc(t('sung'))}</span></div>`;
}
function songsByService(){
  const ev = S.events.filter(e => e.kind !== 'rehearsal' && inRange(e.date, S.from, S.to)).slice().reverse();
  if (!ev.length) return `<div class="msg">${esc(t('noEvents'))}</div>`;
  return ev.map(e => {

/* Marking pages are buffered: taps change S.edit only, Save writes the diff.
   That way nothing reaches the database until the director says so, and no
   empty events are left behind by someone just looking around. */
function editFor(mode, ev){
  const key = mode + ':' + ev.id;
  if (!S.edit || S.edit.key !== key) {
    const base = ev.id === 'new' ? []
      : mode === 'att' ? S.absences.filter(a => a.event_id === ev.id).map(a => a.singer_id)
                       : S.eventSongs.filter(x => x.event_id === ev.id).map(x => x.song_id);
    S.edit = { key, mode, evId: ev.id, base: new Set(base), sel: new Set(base) };
  }
  return S.edit;
}
function editDelta(){
  const e = S.edit; if (!e) return { add: [], rm: [], n: 0 };
  const add = [...e.sel].filter(x => !e.base.has(x));
  const rm  = [...e.base].filter(x => !e.sel.has(x));
  return { add, rm, n: add.length + rm.length };
}
function editDirty(){ return !!S.edit && (S.edit.evId === 'new' || editDelta().n > 0); }
function saveBar(mode){
  const isNew = S.edit && S.edit.evId === 'new', n = editDelta().n;
  const status = isNew ? t('newEntry') : n ? t('unsavedN')(n) : t('noChanges');
  return `<div class="note">${esc(t('autosave'))}</div>
    <div class="savebar">
      <div class="st ${isNew || n ? 'live' : ''}">${esc(status)}</div>
      <button class="sb ghost" data-cancel-marks="${mode}">${esc(t('cancel'))}</button>
      <button class="sb go" data-save-marks ${isNew || n ? '' : 'disabled'}>${esc(t('save'))}</button>

}

/* ---------- CSV export ---------- */
function download(name, text){
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

function exportCSV(kind){
  const ev = S.events.slice().sort((a,b) => a.date < b.date ? -1 : 1);
  if (kind === 'att') {
    const head = ['singer','part', ...ev.map(e => e.date + ' ' + evLabel(e))];
    const rows = PARTS.flatMap(p => S.singers.filter(s => s.part === p).map(s =>
      [s.name, p, ...ev.map(e => isAbsent(e.id, s.id) ? 'A' : '')]));
    download('attendance-' + today() + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  } else {
    const head = ['date','event','song','subtitle'];
    const rows = [];
    ev.forEach(e => S.eventSongs.filter(x => x.event_id === e.id).forEach(x => {
      const s = S.songs.find(y => y.id === x.song_id); if (!s) return;
      rows.push([e.date, e.name || e.kind, s.title, s.subtitle]);
    }));
    download('songs-' + today() + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  }
}

  const r = S.route;
  let html = mast();

  if (S.loading) { document.getElementById('app').innerHTML = html + `<div class="msg">${esc(t('loading'))}</div>`; return; }

  if (r.startsWith('#/admin')) {
    if (!S.session) { location.hash = '#/login'; return; }
    const seg = r.split('/');          // #, admin, section, id?
    const section = seg[2] || 'attendance', id = seg[3];
    const ev = id === 'new' ? (S.pending ? Object.assign({ id: 'new' }, S.pending) : null)
             : id ? S.events.find(e => e.id === id) : null;
    html += publicNav('admin');
    html += `<div class="body">`;
    if (section === 'attendance') html += ev ? markAttendance(ev) : eventPicker('att');
    else if (section === 'songs') html += ev ? markSongs(ev) : eventPicker('songs');

    html += `</div>` + adminBar(section === 'attendance' ? 'att' : section === 'songs' ? 'songs'
      : section === 'songlist' ? 'list' : 'members');
  }
  else if (r.startsWith('#/login')) { html += publicNav('') + loginPage(); }
  else if (r.startsWith('#/sheets')) { html += publicNav('sheets') + sheetsPage(); }
  else if (r.startsWith('#/home')) { html += publicNav('home') + homePage(); }
  else if (r.startsWith('#/songs')) {
    const tab = r.split('/')[2] || 'grid';
    html += publicNav('songs') + `<div class="tabs">
      <a href="#/songs/grid" class="${tab==='grid'?'on':''}">${esc(t('grid'))}</a>
      <a href="#/songs/services" class="${tab==='services'?'on':''}">${esc(t('byService'))}</a>
      <a href="#/songs/summary" class="${tab==='summary'?'on':''}">${esc(t('summary'))}</a></div>`;
    if (tab === 'summary') html += rangeCtrl('sum') + songsSummary();
    else if (tab === 'services') html += rangeCtrl('grid') + songsByService();
    else html += rangeCtrl('grid')
      + `<div class="searchrow"><input class="field" id="q" placeholder="${esc(t('search'))}" value="${esc(S.query)}"></div>`
      + songsGrid();
  }
  else {
    const tab = r.split('/')[2] || 'grid';
    html += publicNav('att') + `<div class="tabs">
      <a href="#/attendance/grid" class="${tab==='grid'?'on':''}">${esc(t('grid'))}</a>
      <a href="#/attendance/summary" class="${tab==='summary'?'on':''}">${esc(t('summary'))}</a></div>`;
    if (tab === 'summary') html += rangeCtrl('sum') + attendanceSummary();
    else html += rangeCtrl('grid', true) + attendanceGrid();

  afterRender();
}

function toastHTML(){
  if (!S.toast) return '';
  return `<div class="toast"><div class="m">${esc(S.toast)}</div>
    ${S.retry ? `<button data-retry>${esc(t('retry'))}</button>` : ''}
    <button data-dismiss>×</button></div>`;
}

// keep the newest dates in view: jump the grid to its right edge when the page changes
function afterRender(){
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  const key = S.route + '|' + S.from + '|' + S.to + '|' + S.typeFilter;
  // innerHTML rebuilds the grid, so scroll position has to be re-applied every render:
  // jump to the newest dates when the page or range changes, otherwise stay put.
  if (S.scrollKey !== key) { S.scrollKey = key; sc.scrollLeft = sc.scrollWidth; }
  else if (S.scrollLeft) { sc.scrollLeft = S.scrollLeft; }
  S.scrollLeft = sc.scrollLeft;
  sc.addEventListener('scroll', () => { S.scrollLeft = sc.scrollLeft; }, { passive: true });
}

/* An expired access token is rejected by row-level security with no error object —
   the write simply affects nothing. Refresh before every admin write, and treat
   "zero rows changed" as a lost session rather than a success. */
async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.session = null; render(); return false; }
  if ((session.expires_at || 0) * 1000 - Date.now() < 60000) {
    const { data, error } = await sb.auth.refreshSession();
    if (error || !data.session) { S.session = null; location.hash = '#/login'; return false; }
    S.session = data.session;
  }
  return true;
}

function wrote(res){
  if (res.error) { fail(res.error); return false; }
  if (Array.isArray(res.data) && res.data.length === 0) {
    fail({ message: t('sessionLost') });
    S.session = null;
    return false;
  }
  return true;
}

function fail(error, retry){
  S.toast = t('notSaved') + ' — ' + (navigator.onLine ? error.message : t('offline'));
  S.retry = retry || null;
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-lang],[data-preset],[data-type],[data-kind],[data-go],[data-toggle-absent],[data-toggle-song],[data-save-marks],[data-cancel-marks],[data-add-song],[data-del-song],[data-edit-song],[data-add-singer],[data-del-singer],[data-edit-singer],[data-login],[data-signout],[data-del-event],[data-export],[data-dismiss],[data-retry],[data-toggle-range],[data-del-pdf]');
  if (!el) return;
  const d = el.dataset;

  if (d.lang) { S.lang = d.lang; localStorage.setItem('bsebc-youth-lang', d.lang); return render(); }

  if (el.hasAttribute('data-toggle-range')) { S.showRange = !S.showRange; return render(); }
  if (d.preset) {
    const months = d.preset === 'all' ? 600 : +d.preset;
    S.preset[d.range] = d.preset;
    if (d.range === 'sum') { S.sumFrom = shift(months); S.sumTo = today(); }
    else { S.from = shift(months); S.to = today(); }
    return render();
  }
  if (d.type) { S.typeFilter = d.type; return render(); }
  if (d.kind) { S.draft.kind = d.kind; return render(); }

  if (d.go) {
    const dateEl = document.getElementById('draft-date');
    S.draft.date = dateEl ? dateEl.value : S.draft.date;
    const nameEl = document.getElementById('draft-name'), labEl = document.getElementById('draft-label');
    if (nameEl) S.draft.name = nameEl.value;
    if (labEl) S.draft.label = labEl.value;
    const label = S.draft.kind === 'other'
      ? (S.draft.label || (S.draft.name || '?').slice(0,2)) : KIND_LABEL[S.lang][S.draft.kind];
    const row = { date: S.draft.date, kind: S.draft.kind, label, name: S.draft.kind === 'other' ? S.draft.name : null };
    const ev = S.events.find(x => x.date === row.date && x.kind === row.kind && (x.name || '') === (row.name || ''));
    S.pending = ev ? null : row;          // written only when Save is pressed
    S.edit = null;
    location.hash = '#/admin/' + (d.go === 'att' ? 'attendance' : 'songs') + '/' + (ev ? ev.id : 'new');
    return;
  }

  const mark = d.toggleAbsent || d.toggleSong;
  if (mark && S.edit) {
    S.toast = ''; S.retry = null;
    S.edit.sel.has(mark) ? S.edit.sel.delete(mark) : S.edit.sel.add(mark);
    return render();
  }
  if (d.cancelMarks) {
    e.preventDefault();
    if (editDirty() && !confirm(t('discardQ'))) return;
    S.edit = null; S.pending = null;
    location.hash = '#/admin/' + (d.cancelMarks === 'att' ? 'attendance' : 'songs');
    return;
  }
  if (el.hasAttribute('data-save-marks')) {
    const E = S.edit; if (!E) return;
    if (!await ensureSession()) return;
    S.toast = ''; S.retry = null;
    let evId = E.evId;
    if (evId === 'new') {
      const { data, error } = await sb.from('events').insert(S.pending).select().single();
      if (error) return fail(error);
      S.events.push(data); S.events.sort((a,b) => a.date < b.date ? -1 : 1);
      evId = data.id; S.pending = null;
    }
    const table = E.mode === 'att' ? 'absences' : 'event_songs';
    const col   = E.mode === 'att' ? 'singer_id' : 'song_id';
    const { add, rm } = editDelta();
    if (add.length) {
      const { error } = await sb.from(table).insert(add.map(x => ({ event_id: evId, [col]: x })));
      if (error) return fail(error);
    }
    if (rm.length) {
      const { error } = await sb.from(table).delete().eq('event_id', evId).in(col, rm);
      if (error) return fail(error);
    }
    const rows = [...E.sel].map(x => ({ event_id: evId, [col]: x }));
    if (E.mode === 'att') S.absences = S.absences.filter(a => a.event_id !== evId).concat(rows);
    else S.eventSongs = S.eventSongs.filter(x => x.event_id !== evId).concat(rows);
    S.edit = null; S.toast = t('savedOk');
    location.hash = '#/admin/' + (E.mode === 'att' ? 'attendance' : 'songs');
    render();
    return load(true);   // silent re-read, so the grids match the database exactly
  }

  if (d.delEvent) {
    e.preventDefault();
    if (!confirm(t('deleteEvent'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('events').delete().eq('id', d.delEvent).select();
    if (!wrote(res)) return render();
    S.events = S.events.filter(x => x.id !== d.delEvent);
    S.absences = S.absences.filter(a => a.event_id !== d.delEvent);
    S.eventSongs = S.eventSongs.filter(x => x.event_id !== d.delEvent);
    return render();
  }
  if (d.delPdf) {
    const song = S.songs.find(s => s.id === d.delPdf);
    if (!song || !song.pdf_path || !confirm(t('confirmRemovePdf'))) return;
    const path = song.pdf_path;
    const { error } = await sb.from('songs').update({ pdf_path: null }).eq('id', song.id);
    if (error) return fail(error);
    song.pdf_path = null; render();
    await sb.storage.from('sheets').remove([path]);
    return;
  }
  if (d.export) { return exportCSV(d.export); }
  if (el.hasAttribute('data-dismiss')) { S.toast = ''; S.retry = null; return render(); }
  if (el.hasAttribute('data-retry')) { const r = S.retry; S.toast = ''; S.retry = null; render(); return r && r(); }

  if (d.addSong !== undefined && el.hasAttribute('data-add-song')) {
    const title = document.getElementById('new-song-title').value.trim();
    if (!title) return;
    const subtitle = document.getElementById('new-song-sub').value.trim() || null;
    const { data, error } = await sb.from('songs').insert({ title, subtitle }).select().single();
    if (error) return fail(error);
    S.songs.push(data); S.songs.sort((a,b) => a.title.localeCompare(b.title)); return render();
  }
  if (d.editSong) {
    const s = S.songs.find(x => x.id === d.editSong);
    const title = prompt(t('renameSong'), s.title); if (title === null) return;
    const clean = title.trim(); if (!clean) return;
    const subtitle = prompt(t('subtitle'), s.subtitle || '');
    if (!await ensureSession()) return;
    const res = await sb.from('songs').update({ title: clean, subtitle: (subtitle || '').trim() || null })
      .eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.title = clean; s.subtitle = (subtitle || '').trim() || null;
    S.songs.sort((a,b) => a.title.localeCompare(b.title));
    return render();
  }
  if (d.delSong) {
    if (!confirm(t('deleteSong'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('songs').delete().eq('id', d.delSong).select();
    if (!wrote(res)) return render();
    S.songs = S.songs.filter(x => x.id !== d.delSong);
    S.eventSongs = S.eventSongs.filter(x => x.song_id !== d.delSong);
    return render();
  }
  if (el.hasAttribute('data-add-singer')) {
    const name = document.getElementById('new-singer-name').value.trim();
    if (!name) return;
    const part = document.getElementById('new-singer-part').value;
    const { data, error } = await sb.from('singers').insert({ name, part }).select().single();
    if (error) return fail(error);
    S.singers.push(data); return render();
  }
  if (d.editSinger) {
    const s = S.singers.find(x => x.id === d.editSinger);
    const name = prompt(t('renameSinger'), s.name); if (name === null) return;
    const clean = name.trim(); if (!clean) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').update({ name: clean }).eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.name = clean; return render();
  }
  if (d.delSinger) {
    if (!confirm(t('deleteSinger'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').delete().eq('id', d.delSinger).select();
    if (!wrote(res)) return render();
    S.singers = S.singers.filter(x => x.id !== d.delSinger);
    S.absences = S.absences.filter(x => x.singer_id !== d.delSinger);
    return render();
  }

  if (el.hasAttribute('data-login')) {
    const email = document.getElementById('em').value.trim();
    const password = document.getElementById('pw').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { S.error = error.message; return render(); }
    S.session = data.session; S.error = ''; location.hash = '#/admin/attendance'; return;
  }
  if (el.hasAttribute('data-signout')) { await sb.auth.signOut(); S.session = null; location.hash = '#/attendance'; return; }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.upload) {
    const song = S.songs.find(s => s.id === el.dataset.upload);
    const file = el.files && el.files[0];
    if (!song || !file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { alert(t('pdfOnly')); return; }
    const old = song.pdf_path;
    const path = song.id + '/' + Date.now() + '.pdf';
    S.uploading = song.id; render();
    const up = await sb.storage.from('sheets').upload(path, file, { contentType: 'application/pdf' });
    if (up.error) { S.uploading = null; return fail(up.error); }
    const { error } = await sb.from('songs').update({ pdf_path: path }).eq('id', song.id);
    if (error) { S.uploading = null; await sb.storage.from('sheets').remove([path]); return fail(error); }
    song.pdf_path = path;
    if (old) await sb.storage.from('sheets').remove([old]);
    S.uploading = null; return render();
  }
  if (el.dataset.range) {
    const v = el.value;
    S.preset[el.dataset.range] = null;
    if (el.dataset.range === 'sum') { if (el.dataset.edge === 'from') S.sumFrom = v; else S.sumTo = v; }
    else { if (el.dataset.edge === 'from') S.from = v; else S.to = v; }
    render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.query = e.target.value;
    const pos = e.target.selectionStart; render();
    const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
window.addEventListener('hashchange', () => {
  S.route = location.hash || '#/home';
  if (!/^#\/admin\/(attendance|songs)\/.+/.test(S.route)) { S.edit = null; S.pending = null; }
  S.error = ''; S.query = '';
  render();
});

/* ---------- boot ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('online', () => { if (S.toast) { S.toast = ''; render(); } load(true); });
S.from = shift(2); S.to = today(); S.sumFrom = shift(6); S.sumTo = today();
let wasWide = isWide();
window.addEventListener('resize', () => { if (isWide() !== wasWide) { wasWide = isWide(); render(); } });
const { data: { session } } = await sb.auth.getSession();
S.session = session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; render(); });
// iOS suspends a home-screen app rather than closing it: the token can be hours
// stale when it comes back. Refresh it, and re-read the data, on return.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.session) await ensureSession();
  load(true);
});
await load();
</script>
</body>
</html>
