<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BSEBC Youth Choir</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#17203a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Youth Choir">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17203a; --paper:#eff0ec; --rule:#dcded7; --blue:#2c3e8f;
    --red:#9e3b2e; --gold:#c9a227; --green:#3f7d4e; --muted:#6b7166; --faint:#8a9086;
    --nameW:152px; --tallyW:46px; --cell:34px; --songW:168px;
  }
  @media (min-width:900px){ :root{ --nameW:220px; --tallyW:62px; --cell:40px; --songW:280px; } }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--ink);font-family:'Golos Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;touch-action:manipulation}
  input,select,textarea{font-size:16px}  /* 16px or more stops iOS zooming on focus */
  a{color:var(--blue);text-decoration:none}
  a:hover{color:var(--ink)}
  button{font:inherit;cursor:pointer}
  input,select{font:inherit;color:var(--ink)}
  .wrap{max-width:1200px;margin:0 auto;background:#fff;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  /* masthead */
  .mast{background:linear-gradient(180deg,#1c2645,var(--ink));padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));padding-left:calc(16px + env(safe-area-inset-left));padding-right:calc(16px + env(safe-area-inset-right));display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;flex:none;display:block}
  .brand{font-family:'Alice',serif;color:#fff;font-size:20px;line-height:1.1;letter-spacing:.01em}
  .lang{margin-left:auto;display:flex;border:1px solid #3a4463;border-radius:999px;overflow:hidden}
  .lang button{padding:5px 11px;font-size:12px;font-weight:600;border:0;background:transparent;color:#9aa3bd;letter-spacing:.04em;transition:background .16s ease,color .16s ease}
  .lang button:hover:not(.on){color:#fff}
  .lang button.on{background:var(--gold);color:var(--ink)}
  .gold{height:2px;background:var(--gold)}
  .nav{display:flex;align-items:center;gap:2px;background:var(--ink);padding:7px 8px;
    overflow-x:auto;overflow-y:visible;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .nav::-webkit-scrollbar{display:none}
  .nav a,.nav .navbtn{flex:none;display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;
    border:0;background:transparent;border-radius:8px;font-family:inherit;font-size:14px;font-weight:500;
    line-height:1;color:#9aa3bd;white-space:nowrap;transition:background .16s ease,color .16s ease}
  .nav a:hover,.nav .navbtn:hover{color:#fff;background:rgba(255,255,255,.08)}
  .nav a.on,.nav .navbtn.on{color:var(--ink);background:var(--gold);font-weight:600}
  .nav a.on:hover,.nav .navbtn.on:hover{color:var(--ink);background:#d5ae2e}
  .nav .right{margin-left:auto;position:sticky;right:0;background:var(--ink);box-shadow:-10px 0 10px var(--ink)}

  /* tabs + controls */
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--rule)}
  .tabs a{flex:1;min-width:0;padding:11px 4px;text-align:center;font-size:15px;color:var(--muted);border-bottom:3px solid transparent;transition:color .16s ease,border-color .16s ease}
  .tabs a:hover{color:var(--ink)}
  .tabs a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
  .ctrl{background:#fff;padding:12px 14px 14px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:10px}
  .ctlbar{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--rule)}
  .ctlbar .rangebtn{width:100%;justify-content:space-between}
  .ctlbar .seg.tiny{margin-left:0}
  .ctlbar .seg.tiny button{flex:1}
  .ctlbar.wide{flex-direction:row;align-items:center;gap:16px;padding:12px 20px;flex-wrap:wrap}
  .ctlbar.wide .chips{flex:none}
  .ctlbar.wide .chips button{padding:7px 16px}
  .ctlbar.wide .dates{flex:none;width:340px}
  .ctlbar.wide .seg.tiny{margin-left:auto}
  .ctlbar.wide .rangebtn{width:auto}
  .rangebtn.open{border-color:var(--ink);background:#fff}
  .rangebtn{display:flex;align-items:center;gap:7px;border:1px solid var(--blue);background:#f2f4fb;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
  .rangebtn .lb{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .rangebtn .rv{font-weight:600}
  .rangebtn .ed{font-style:normal;color:var(--blue);font-weight:600;font-size:12px}
  .seg.tiny{margin-left:auto;border-radius:999px}
  .seg.tiny button{padding:7px 11px;font-size:13px}
  .panel{background:#fbfbf9;border-bottom:1px solid var(--rule);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
  .savebar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 16px;
    padding-bottom:calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
    backdrop-filter:blur(8px);border-top:1px solid var(--rule);box-shadow:0 -6px 20px -14px rgba(23,32,58,.4);z-index:5}
  .savebar .st{flex:1;min-width:0;font-size:13px;color:var(--muted)}
  .savebar .st.live{color:var(--ink);font-weight:600}
  .savebar .sb{min-height:44px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:600;border:1px solid var(--rule);
    background:#fff;color:#3c4438;transition:background .15s ease,border-color .15s ease,opacity .15s ease}
  .savebar .sb.ghost:hover{background:var(--paper)}
  .savebar .sb.go{background:var(--blue);border-color:var(--blue);color:#fff}
  .savebar .sb.go:hover{background:#33488f}
  .savebar .sb[disabled]{opacity:.45;cursor:default}
  .caret{width:20px;flex:none;text-align:right;font-size:12px;color:var(--faint)}
  .li.on .caret{color:var(--blue)}
  .drawer{background:#fbfbf9;border-bottom:1px solid var(--rule);padding:4px 16px 12px}
  .drawer .dh{display:flex;align-items:baseline;gap:8px;padding:10px 0 6px;font-size:12px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .drawer .dh span{text-transform:none;letter-spacing:0;color:var(--faint)}
  .drawer .dr{display:flex;align-items:baseline;gap:12px;padding:5px 0;border-top:1px solid #e9eae4}
  .drawer .dd{width:44%;flex:none;font-size:14px;font-variant-numeric:tabular-nums}
  .drawer .dk{flex:1;min-width:0;font-size:13px;color:var(--muted)}
  .drawer .dk.cx{color:var(--red)}
  .ver{padding:4px 16px 24px;text-align:center;font-size:12px;color:var(--faint);
    font-variant-numeric:tabular-nums;letter-spacing:.04em}
  .sectbar em{font-style:normal;font-weight:400;text-transform:none;letter-spacing:0;color:var(--faint);margin-left:8px}
  .fold{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;border:0;
    border-bottom:1px solid var(--rule);background:var(--paper);text-align:left;font-family:inherit;
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .fold span{flex:1;min-width:0}
  .fold em{font-style:normal;font-weight:600;text-transform:none;letter-spacing:0;font-size:13px;color:var(--blue)}
  .fold.open{background:#fff}
  .crow{padding:12px 16px;border-bottom:1px solid var(--rule);background:#fff}
  .crow .ct{display:flex;gap:8px;font-size:15px;line-height:1.25;margin-bottom:8px}
  .crow .ct span{flex:none;min-width:1.3em;font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
  .crow .cf{display:flex;gap:8px}
  .cr{flex:1;min-width:0;display:grid;gap:4px}
  .cr em{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .cr select{width:100%;min-width:0;border:1px solid var(--rule);border-radius:7px;background:#fff;
    padding:7px 8px;font-size:13px;color:var(--ink)}
  .who{display:inline-flex;align-items:center;gap:4px;margin-left:8px;font-size:11px;color:var(--muted);
    white-space:nowrap;vertical-align:middle}
  .who i{font-style:normal;font-weight:700;font-size:9px;line-height:1;padding:2px 4px;border-radius:3px;
    background:var(--paper);border:1px solid var(--rule);color:var(--faint)}
  .s .st{vertical-align:middle}
  .drawer .dc{flex:none;text-align:right}
  .drawer .dc .who{margin-left:6px}
  .dpick{position:relative;flex:1;min-width:0;display:block}
  .dpick span{display:block;border:1px solid var(--rule);border-radius:8px;background:#fbfbf9;
    padding:10px 11px;font-size:15px;line-height:1.2;color:var(--ink);text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .15s ease,background .15s ease}
  .dpick:hover span{border-color:#b9bdb2;background:#fff}
  .dpick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;
    -webkit-appearance:none;appearance:none;border:0;padding:0;background:transparent}
  .dpick:focus-within span{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(58,80,160,.12)}
  .dates .sep{flex:none;color:var(--faint)}
  .s b{display:inline-block;min-width:1.3em;margin-right:7px;color:var(--muted);font-weight:600;
    font-variant-numeric:tabular-nums}
  .pager{display:flex;align-items:center;gap:10px;padding:0 16px 20px}
  .pager .pg{flex:1;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  a.back{text-decoration:none}
  .back{border:0;background:transparent;font-size:26px;line-height:1;color:var(--faint);padding:0 8px 0 0;margin-right:2px}
  .back:hover{color:var(--ink)}
  .searchrow{padding:12px;background:#fff;border-bottom:1px solid var(--rule)}
  .hero{padding:22px 16px 4px;font-family:'Alice',serif;font-size:19px;line-height:1.3;color:var(--ink);background:#fff;text-wrap:pretty}
  .hero::after{content:'';display:block;width:38px;height:2px;background:var(--gold);margin-top:12px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 16px 28px;background:#fff}
  @media (min-width:700px){ .tiles{grid-template-columns:repeat(3,1fr);gap:16px;padding:18px 20px 34px} }
  .tile{display:flex;flex-direction:column;gap:12px;border:1px solid var(--rule);border-radius:18px;padding:16px;background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(23,32,58,.05);transition:box-shadow .18s ease,border-color .18s ease,transform .18s ease}
  .tile:hover{border-color:#c3c8be;box-shadow:0 10px 26px -12px rgba(23,32,58,.28);transform:translateY(-2px)}
  .tile:active{transform:translateY(0);box-shadow:0 1px 2px rgba(23,32,58,.05)}
  .tile.dark:hover{border-color:var(--gold)}
  .tile .tt{font-family:'Alice',serif;font-size:17px;line-height:1.15}
  .tile .ts{font-size:12px;color:var(--muted);line-height:1.3;text-wrap:pretty}
  .tile.dark{background:var(--ink);border-color:var(--ink);color:#fff}
  .tile.dark .ts{color:#9aa3bd}
  /* app-style icons, drawn from plain divs */
  .ic{width:52px;height:52px;border-radius:15px;background:linear-gradient(180deg,#fbfbf9,var(--paper));border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;padding:9px;box-shadow:inset 0 1px 0 #fff}
  .tile:hover .ic{border-color:#c3c8be}
  .tile.dark .ic{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18)}
  .ic-note{width:100%;height:100%;display:block;overflow:visible}
  .ic-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;width:100%;height:100%}
  .ic-grid span{background:#c9cdc4;border-radius:1px}
  .ic-grid span.on{background:var(--red)}
  .ic-grid span.b{background:var(--blue)}
  .ic-bars{display:flex;flex-direction:column;justify-content:center;gap:5px;width:100%;height:100%}
  .ic-bars span{height:5px;border-radius:3px;background:var(--blue)}
  .ic-cols{display:flex;align-items:flex-end;gap:4px;width:100%;height:100%}
  .ic-cols span{flex:1;background:var(--blue);border-radius:2px}
  .ic-lines{display:flex;flex-direction:column;justify-content:center;gap:5px;width:100%;height:100%;border-left:2px solid var(--gold);padding-left:7px}
  .ic-lines span{height:4px;border-radius:2px;background:#c9cdc4}
  .ic-user{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .ic-user b{width:13px;height:13px;border-radius:50%;background:var(--gold);display:block}
  .ic-user i{width:24px;height:12px;border-radius:12px 12px 0 0;background:var(--gold);display:block}
  .ic-doc{width:26px;height:32px;background:#fff;border:1px solid #c9cdc4;border-radius:2px;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 5px}
  .ic-doc span{height:3px;border-radius:2px;background:var(--blue)}
  .ic-doc span:last-child{width:60%;background:#c9cdc4}
  @media (min-width:900px){ .panel{flex-direction:row;align-items:center;gap:20px} .panel .dates{max-width:420px} }
  @media (min-width:900px){ .ctrl{flex-direction:row;align-items:center;flex-wrap:wrap;padding:16px 20px} }
  .dates{display:flex;align-items:center;gap:8px}
  .dates input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;font-size:16px;background:#fbfbf9;font-variant-numeric:tabular-nums}
  .chips{display:flex;gap:6px}
  .chips button{flex:1;padding:7px 10px;border-radius:999px;font-size:13px;border:1px solid var(--rule);background:var(--paper);color:#3c4438;white-space:nowrap;transition:background .15s ease,border-color .15s ease,color .15s ease}
  .chips button:hover:not(.on){border-color:#b9bdb2;background:#fff}
  .chips button.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
  .seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
  .seg button{flex:1;padding:8px 6px;font-size:14px;border:0;background:#fff;color:#3c4438;border-left:1px solid var(--rule);transition:background .15s ease,color .15s ease}
  .seg button:hover:not(.on){background:var(--paper)}
  .seg button:first-child{border-left:0}
  .seg button.on{background:var(--blue);color:#fff;font-weight:600}
  .field{width:100%;max-width:100%;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:10px 11px;font-size:16px;background:#fbfbf9;transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
  .field:focus,.dates input:focus{outline:0;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(58,80,160,.12)}
  input[type=date].field{-webkit-appearance:none;appearance:none;display:block;text-align:left}
  .card{min-width:0}
  .card > *{min-width:0;max-width:100%}
  .dates input{-webkit-appearance:none;appearance:none}
  /* grid */
  .scroll{overflow:auto;background:#fff;border-bottom:1px solid var(--rule);overscroll-behavior:contain}
  .gwrap{min-width:max-content}
  .topctl{position:sticky;left:0;z-index:7;width:var(--vw,100%);background:#fff}
  .endbar{position:sticky;left:0;width:var(--vw,100%);background:#fff;border-top:1px solid var(--rule)}
  .endbar + .endbar{border-top:0}
  .row{display:flex;min-width:100%}
  .spacer{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:#fff;border-right:2px solid var(--ink)}
  .hmonth{position:sticky;top:0;z-index:5}
  .hmonth .spacer{z-index:6;height:26px;background:#f4f5f1;border-bottom:1px solid var(--rule)}
  .hmonth .m{height:26px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Alice',serif;font-size:13px;background:#f4f5f1;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden}
  .hday{position:sticky;top:26px;z-index:5}
  .hday .spacer{z-index:6;height:40px;display:flex;align-items:center;padding:0 8px;font-family:'Alice',serif;font-size:13px;color:var(--muted);border-bottom:2px solid var(--ink)}
  .hday .d{width:var(--cell);flex:none;height:40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:#fff;border-right:1px solid var(--rule);border-bottom:2px solid var(--ink)}
  .hday .d.svc{background:#e7ebf5}
  .hday .d span{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
  .hday .d em{font-size:10px;font-style:normal;color:var(--muted);line-height:1}
  .hday .d.svc em{color:var(--blue)}
  .sect{display:flex;min-width:100%}
  .sect{position:sticky;top:66px;z-index:4}
  .sect .lbl{width:calc(var(--nameW) + var(--tallyW));flex:none;position:sticky;left:0;z-index:3;background:var(--ink);color:var(--paper);height:28px;display:flex;align-items:center;padding:0 10px;font-family:'Alice',serif;font-size:12px;letter-spacing:.16em}
  .sect .fill{flex:1 0 auto;height:28px;background:var(--ink);color:#7c86a3;display:flex;align-items:center;justify-content:flex-end;padding:0 10px;font-size:11px}
  .name{width:var(--nameW);flex:none;height:var(--cell);position:sticky;left:0;z-index:2;background:#fff;display:flex;align-items:center;padding:0 8px;font-size:14px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tally{width:var(--tallyW);flex:none;height:var(--cell);position:sticky;left:var(--nameW);z-index:2;background:#fbfbf9;display:flex;align-items:center;justify-content:center;font-size:14px;font-variant-numeric:tabular-nums;color:#3c4438;border-right:2px solid var(--ink);border-bottom:1px solid var(--rule)}
  .tally.ok{color:var(--green)}
  .tally.mid{color:var(--gold)}
  .tally.low{color:var(--red)}
  .cell{width:var(--cell);flex:none;height:var(--cell);display:flex;align-items:center;justify-content:center;background:#fff;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:15px;font-weight:700;color:var(--red)}
  .cell.svc{background:#e7ebf5}
  .cell.na{background:#f1f2ee;color:#b3b7ac}
  .cell.cx{background:repeating-linear-gradient(135deg,#eceee8 0 4px,#f6f7f3 4px 8px);color:#b3b7ac;font-size:13px}
  .hday .d.cx{color:var(--faint);background:#f0f1ed}
  .hday .d.cx em{color:#b3b7ac}
  .legend i.cx{background:repeating-linear-gradient(135deg,#eceee8 0 4px,#f6f7f3 4px 8px);border-color:var(--rule)}
  .cell .sq{width:14px;height:14px;background:var(--ink)}
  .tail{flex:1 0 auto;background:#fff;border-bottom:1px solid var(--rule)}
  .srow .name,.srow .tally,.srow .cell{height:48px}
  .srow .name{width:var(--songW);flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;white-space:normal;line-height:1.15}
  .srow .tally{left:var(--songW)}
  .srow .spacer,.srow.hd .spacer{width:calc(var(--songW) + var(--tallyW))}
  .sub{font-size:11px;color:var(--faint);font-style:italic}
  .legend{padding:8px 12px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:11px;color:var(--muted);line-height:1.2}
  @media (min-width:900px){ .legend{padding:12px 14px;gap:14px;font-size:12px} }
  .legend i.na{color:#b3b7ac;background:#f1f2ee}
  .legend i{width:16px;height:16px;border:1px solid var(--rule);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-weight:700;font-size:11px;color:var(--red)}
  /* lists */
  .sectbar{background:var(--ink);color:var(--paper);font-family:'Alice',serif;font-size:13px;letter-spacing:.14em;padding:7px 16px}
  .li{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--rule);background:#fff}
  .li.tap{min-height:58px;cursor:pointer;user-select:none;transition:background .14s ease}
  .li.tap:hover{background:#fbfbf9}
  .li.tap:hover.off{background:#f4e2de}
  .mini.locked{background:#f4efdc;border-color:#e2d6a8;color:#8a7320;cursor:default}
  .mini.on{background:#f4efdc;border-color:#e2d6a8;color:#8a7320}
  .mini.icon{padding:0;width:40px;flex:none}

function today(){ return new Date().toISOString().slice(0,10); }

function shift(months){ const d = new Date(); d.setMonth(d.getMonth() - months); return d.toISOString().slice(0,10); }
function fmtLong(iso){ const [y,m,d] = iso.split('-').map(Number);
  return S.lang === 'en' ? MONF.en[m-1] + ' ' + d + ', ' + y : d + ' ' + MONF.ru[m-1] + ' ' + y; }
function fmtShort(iso){ const [y,m,d] = iso.split('-');
  return m + '/' + d + '/' + y.slice(2); }   // numeric dates stay mm/dd/yy in both languages
function fmtPill(iso){ const [y,m,d] = iso.split('-');
  return MON[S.lang][+m-1] + ' ' + +d + ', ' + y; }

/* ---------- data ---------- */
/* Supabase caps one response at 1000 rows, and years of absences run well past
   that — read every table in pages so nothing silently goes missing. Ordering
   is fully deterministic, otherwise page boundaries could skip or repeat rows. */
async function selectAll(table, order){
  const STEP = 1000;
  let rows = [], from = 0;
  for (;;) {
    let q = sb.from(table).select('*');
    order.forEach(c => { q = q.order(c); });
    const r = await q.range(from, from + STEP - 1);
    if (r.error) return { data: rows, error: r.error };
    rows = rows.concat(r.data || []);
    if ((r.data || []).length < STEP) return { data: rows, error: null };
    from += STEP;
  }
}
async function load(silent){
  if (!silent) { S.loading = true; render(); }
  const [si, so, ev, ab, es] = await Promise.all([
    selectAll('singers', ['part','sort_order','name']),
    selectAll('songs', ['title','id']),
    selectAll('events', ['date','id']),
    selectAll('absences', ['event_id','singer_id']),
    selectAll('event_songs', ['event_id','position','song_id'])
  ]);
  const err = [si,so,ev,ab,es].find(r => r.error);
  S.error = err ? err.error.message : '';
  S.singers = si.data || []; S.songs = so.data || []; S.events = ev.data || [];
  S.absences = ab.data || []; S.eventSongs = es.data || [];
  S.loading = false; render();
}

/* Three states per singer per event. Only the exceptions are stored:
   an absences row with status 'absent' (missed it) or 'not_listed' (was not in
   the choir yet — excluded from their percentage). No row at all = present. */
function attStatus(e,s){
  const a = S.absences.find(x => x.event_id === e && x.singer_id === s);
  return !a ? 'present' : a.status === 'not_listed' ? 'na' : 'absent';
}
const isAbsent = (e,s) => attStatus(e,s) === 'absent';
/* present / total, counting only events the singer was actually in the choir for */
function attCount(ev, sid){
  let miss = 0, na = 0;
  ev.forEach(e => {
    if (e.cancelled) { na++; return; }          // nothing happened that day
    const st = attStatus(e.id, sid);
    if (st === 'absent') miss++; else if (st === 'na') na++;
  });
  const of = ev.length - na;
  return { miss, na, of, came: of - miss, pct: of ? Math.round((of - miss) / of * 100) : null };
}
const wasSung  = (e,s) => S.eventSongs.some(x => x.event_id === e && x.song_id === s);
/* the songs of one service, in the order the director set */
function songsFor(evId){
  return S.eventSongs.filter(x => x.event_id === evId)
    .slice().sort((a,b) => (a.position ?? 9999) - (b.position ?? 9999))
    .map(x => S.songs.find(s => s.id === x.song_id)).filter(Boolean);
}
/* newest service that has songs — what the home tile shows */
function latestService(){
  return S.events.filter(e => e.kind !== 'rehearsal' && !e.cancelled && songsFor(e.id).length)
    .slice().sort((a,b) => a.date < b.date ? 1 : -1)[0] || null;
}
const inRange  = (d,a,b) => d >= a && d <= b;

const hasAtt = e => e.attendance_taken || S.absences.some(a => a.event_id === e.id);
const hasSongs = e => songsFor(e.id).length > 0;
function gridEvents(){
  return S.events.filter(hasAtt).filter(e => inRange(e.date, S.from, S.to))
    .filter(e => S.typeFilter === 'all' ? true
      : S.typeFilter === 'services' ? e.kind !== 'rehearsal' : e.kind === 'rehearsal');
}
function songStats(id, from, to){
  const rows = S.eventSongs.filter(x => {
    if (x.song_id !== id) return false;
    if (!from) return true;
    const e = S.events.find(y => y.id === x.event_id);
    return e && inRange(e.date, from, to);
  });
  const dates = rows.map(r => (S.events.find(e => e.id === r.event_id) || {}).date).filter(Boolean).sort();
  return { n: rows.length, last: dates.length ? fmtShort(dates[dates.length-1]) : '' };
}

/* Public view of the credits: one row per person, expandable to the songs they
   led. Counts respect the date range, like every other summary here. */
function creditRows(){
  const inSpan = new Map();          // event id -> true, for the current range
  S.events.forEach(e => { if (inRange(e.date, S.from, S.to)) inSpan.set(e.id, e.date); });
  const acc = new Map();             // person id -> {c, p, last, songs:Map}
  const bump = (id, slot, songId, date) => {
    if (!id) return;
    if (!acc.has(id)) acc.set(id, { c: 0, p: 0, last: '', songs: new Map() });
    const a = acc.get(id);
    a[slot]++;
    if (date > a.last) a.last = date;
    a.songs.set(songId, (a.songs.get(songId) || 0) + 1);
  };
  S.eventSongs.forEach(x => {
    const date = inSpan.get(x.event_id);
    if (!date) return;
    bump(x.conductor_id, 'c', x.song_id, date);
    bump(x.pianist_id, 'p', x.song_id, date);
  });
  return [...acc.entries()]
    .map(([id, a]) => ({ person: S.singers.find(s => s.id === id), ...a }))
    .filter(r => r.person)
    .filter(r => S.peopleRole === 'all' ? true : S.peopleRole === 'conductors' ? r.c : r.p)
    .sort((a, b) => (b.c + b.p) - (a.c + a.p) || a.person.name.localeCompare(b.person.name, 'ru'));
}

/* Every entry back to the very first one, newest first, grouped by month.

const ENT_PER_PAGE = 25;
function allEntries(target){
  const scope = S.events.filter(e => target === 'songs'
    ? (e.kind !== 'rehearsal' || hasSongs(e))
    : (hasAtt(e) || !hasSongs(e)));
  const years = [...new Set(scope.map(e => e.date.slice(0,4)))].sort().reverse();
  const all = scope.slice().sort((a,b) => a.date < b.date ? 1 : -1)
    .filter(e => S.entYear === 'all' || e.date.slice(0,4) === S.entYear)
    .filter(e => target === 'songs' ? true
      : S.entType === 'all' ? true
      : S.entType === 'services' ? e.kind !== 'rehearsal' : e.kind === 'rehearsal');
  const pages = Math.max(1, Math.ceil(all.length / ENT_PER_PAGE));
  const page = Math.min(S.entPage, pages - 1);
  const rows = all.slice(page * ENT_PER_PAGE, (page + 1) * ENT_PER_PAGE);
  let month = '';
  const controls = `<div class="ctlbar">

      <div class="chips">${[['all', t('allYears')], ...years.map(y => [y, y])].map(([v,l]) =>
        `<button data-ent-year="${v}" class="${S.entYear===v?'on':''}">${esc(l)}</button>`).join('')}</div>
    </div>`;
  const pager = pages > 1 ? `<div class="pager">
      <button class="mini" data-ent-page="${page-1}" ${page===0?'disabled':''}>${esc(t('prevPage'))}</button>
      <div class="pg">${esc(t('ofPages')(page+1, pages))}</div>
      <button class="mini" data-ent-page="${page+1}" ${page>=pages-1?'disabled':''}>${esc(t('nextPage'))}</button>
    </div>` : '';
  return `<div class="h"><a class="back" href="#/admin/${target==='att'?'attendance':'songs'}">‹</a>
      ${esc(t('allEntries'))}<span class="n">${esc(t('showingN')(rows.length, all.length))}</span></div>` +

        month = k;
        return head + entryRow(e, target);
      }).join('') + '</div>' + pager
    : `<div class="msg">${esc(t('noEntries'))}</div>`);
}
/* Marking pages are buffered: taps change S.edit only, Save writes the diff.
   That way nothing reaches the database until the director says so, and no
   empty events are left behind by someone just looking around. */
function editFor(mode, ev){
  const key = mode + ':' + ev.id;
  if (!S.edit || S.edit.key !== key) {
    const base = new Map();
    if (ev.id !== 'new') {
      if (mode === 'att') S.absences.filter(a => a.event_id === ev.id)
        .forEach(a => base.set(a.singer_id, a.status === 'not_listed' ? 'na' : 'absent'));
      else songsFor(ev.id).forEach((s, i) => {
        const r = songRow(ev.id, s.id) || {};
        base.set(s.id, { pos: i + 1, c: r.conductor_id || '', p: r.pianist_id || '' });
      });
    }
    S.edit = { key, mode, evId: ev.id, base, sel: new Map(base),
               wasCancelled: !!ev.cancelled, cancelled: !!ev.cancelled };
  }
  return S.edit;
}
/* songs: value is {pos, c, p}; attendance: value is 'absent' | 'na' */
const selPos = v => (v && typeof v === 'object') ? v.pos : v;
const orderedSel = () => [...S.edit.sel.entries()].sort((a,b) => selPos(a[1]) - selPos(b[1])).map(e => e[0]);
function renumber(){
  const cur = S.edit.sel;
  S.edit.sel = new Map(orderedSel().map((k, i) => {
    const v = cur.get(k);
    return [k, { pos: i + 1, c: (v && v.c) || '', p: (v && v.p) || '' }];
  }));
}
const sameSel = (a, b) => (a && typeof a === 'object' && b && typeof b === 'object')
  ? (a.pos === b.pos && a.c === b.c && a.p === b.p) : a === b;
function editDelta(){
  const e = S.edit; if (!e) return { del: [], ins: [], n: 0 };
  const del = [], ins = [];
  new Set([...e.base.keys(), ...e.sel.keys()]).forEach(k => {
    const b = e.base.get(k), s = e.sel.get(k);
    if (sameSel(b, s)) return;
    if (b) del.push(k);          // row exists and must go or change
    if (s) ins.push([k, s]);
  });
  return { del, ins, n: new Set([...del, ...ins.map(i => i[0])]).size };
}
const isAttCancelled = E => E.mode === 'att' && E.cancelled;
function editDirty(){
  const E = S.edit;
  if (!E) return false;
  if (E.evId === 'new' || E.cancelled !== E.wasCancelled) return true;
  return !isAttCancelled(E) && editDelta().n > 0;
}
function saveBar(mode){
  const isNew = S.edit && S.edit.evId === 'new', dirty = editDirty();
  const n = isAttCancelled(S.edit) ? S.edit.base.size : editDelta().n;
  const status = isNew ? t('newEntry') : dirty ? t('unsavedN')(Math.max(n, 1)) : t('noChanges');
  return `<div class="note">${esc(t('autosave'))}</div>
    <div class="savebar">
      <div class="st ${dirty ? 'live' : ''}">${esc(status)}</div>
      <button class="sb ghost" data-cancel-marks="${mode}">${esc(t('cancel'))}</button>
      <button class="sb go" data-save-marks ${dirty ? '' : 'disabled'}>${esc(t('save'))}</button>
    </div>`;
}

/* ---------- CSV export ---------- */
function download(name, text){
  const url = URL.createObjectURL(new Blob(['\uFEFF' + text], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';

function exportCSV(kind){
  const ev = S.events.filter(kind === 'att' ? hasAtt : hasSongs)
    .slice().sort((a,b) => a.date < b.date ? -1 : 1);
  if (kind === 'att') {
    const head = ['singer','part', ...ev.map(e => e.date + ' ' + evLabel(e))];
    const rows = PARTS.flatMap(p => S.singers.filter(s => s.part === p).map(s =>
      [s.name, p, ...ev.map(e => { if (e.cancelled) return 'Cancelled';
        const st = attStatus(e.id, s.id);
        return st === 'absent' ? 'Absent' : st === 'na' ? 'Not Listed' : 'Present'; })]));
    download('attendance-' + today() + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  } else {
    const head = ['date','event','no','song','subtitle'];
    const rows = [];
    ev.forEach(e => songsFor(e.id).forEach((s, i) => {
      rows.push([e.date, e.name || e.kind, i + 1, s.title, s.subtitle]);
    }));
    download('songs-' + today() + '.csv', [head, ...rows].map(r => r.map(q).join(',')).join('\n'));
  }
}

/* Size the grid to the space actually left below it. Measuring must not disturb
   the box: clearing maxHeight first would remove the overflow, reset scrollTop,
   change the page height and re-trigger this through the viewport listener. */
let fitPending = false;
function fitGrid(){
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  let below = 0;
  for (let n = sc.nextElementSibling; n; n = n.nextElementSibling) {
    if (getComputedStyle(n).position === 'fixed') continue;
    below += n.getBoundingClientRect().height;
  }
  sc.style.setProperty('--vw', sc.clientWidth + 'px');
  const room = Math.max(220, vh - sc.getBoundingClientRect().top - below - 2);
  if (Math.abs(parseFloat(sc.style.maxHeight) - room) < 1) return;   // already right: don't touch it
  sc.style.maxHeight = room + 'px';
}
function queueFit(){
  if (fitPending) return;
  fitPending = true;
  requestAnimationFrame(() => { fitPending = false; fitGrid(); });
}
window.addEventListener('resize', queueFit, { passive: true });
if (window.visualViewport) window.visualViewport.addEventListener('resize', queueFit, { passive: true });

// keep the newest dates in view: jump the grid to its right edge when the page changes
async function signIn(){
  const email = document.getElementById('em').value.trim();
  const password = document.getElementById('pw').value;
  if (!email || !password) return;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { S.error = error.message; return render(); }
  S.session = data.session; S.error = ''; location.hash = '#/admin/attendance';
}
function afterRender(){
  const lf = document.getElementById('loginform');
  if (lf && !lf.dataset.wired) {
    lf.dataset.wired = '1';
    lf.addEventListener('submit', e => { e.preventDefault(); signIn(); });
  }
  const sc = document.querySelector('.scroll');
  if (!sc) return;
  fitGrid();
  const key = S.route + '|' + S.from + '|' + S.to + '|' + S.typeFilter;
  // innerHTML rebuilds the grid, so scroll position has to be re-applied every render:
  // jump to the newest dates when the page or range changes, otherwise stay put.
  if (S.scrollKey !== key) { S.scrollKey = key; sc.scrollLeft = sc.scrollWidth; }
  else if (S.scrollLeft) { sc.scrollLeft = S.scrollLeft; }
  S.scrollLeft = sc.scrollLeft;
  sc.addEventListener('scroll', () => { S.scrollLeft = sc.scrollLeft; }, { passive: true });
}

/* An expired access token is rejected by row-level security with no error object —
   the write simply affects nothing. Refresh before every admin write, and treat
   "zero rows changed" as a lost session rather than a success. */
async function ensureSession(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { S.session = null; render(); return false; }
  if ((session.expires_at || 0) * 1000 - Date.now() < 60000) {
    const { data, error } = await sb.auth.refreshSession();
    if (error || !data.session) {
      // The stored token is dead. Clear it locally, or every later call retries
      // it and Supabase logs another "Invalid Refresh Token".
      await sb.auth.signOut({ scope: 'local' }).catch(() => {});
      S.session = null; location.hash = '#/login'; return false;
    }
    S.session = data.session;
  }
  return true;
}

function wrote(res){
  if (res.error) { fail(res.error); return false; }
  if (Array.isArray(res.data) && res.data.length === 0) {
    fail({ message: t('sessionLost') });
    S.session = null;
    return false;
  }
  return true;
}

/* a confirmation, not a problem: green, and gone on its own */
let toastTimer = null;
function okToast(msg){
  S.toast = msg; S.toastOk = true; S.retry = null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ''; S.toastOk = false; render(); }, 2500);
}
function fail(error, retry){
  clearTimeout(toastTimer); S.toastOk = false;
  S.toast = t('notSaved') + ' — ' + (navigator.onLine ? error.message : t('offline'));
  S.retry = retry || null;
  render();
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-lang],[data-preset],[data-type],[data-kind],[data-go],[data-toggle-absent],[data-toggle-song],[data-save-marks],[data-cancel-marks],[data-add-song],[data-del-song],[data-edit-song],[data-add-singer],[data-del-singer],[data-edit-singer],[data-signout],[data-del-event],[data-export],[data-dismiss],[data-retry],[data-toggle-range],[data-del-pdf],[data-open],[data-lock],[data-move],[data-toggle-cancel],[data-ent-type],[data-ent-year],[data-ent-page],[data-song-dates],[data-add-role],[data-toggle-pick],[data-person],[data-people-role]');
  if (!el) return;
  const d = el.dataset;

  if (d.lang) { S.lang = d.lang; localStorage.setItem('bsebc-youth-lang', d.lang); return render(); }

  if (el.hasAttribute('data-toggle-range')) { S.showRange = !S.showRange; return render(); }
  if (d.preset) {
    // "All" starts at the earliest entry rather than centuries back
    const first = S.events.reduce((m, e) => e.date < m ? e.date : m, today());
    const start = d.preset === 'all' ? (S.events.length ? first : EPOCH) : shift(+d.preset);
    S.preset = d.preset;
    S.from = start; S.to = today();
    return render();
  }
  if (d.type) { if (d.scope === 'sum') S.sumType = d.type; else S.typeFilter = d.type; return render(); }
  if (el.hasAttribute('data-toggle-pick')) {
    const picked = S.edit ? S.edit.sel.size : 0;
    S.pickOpen = !(S.pickOpen === null ? picked < 3 : S.pickOpen);
    return render();
  }
  if (d.peopleRole) { S.peopleRole = d.peopleRole; S.openPerson = null; return render(); }
  if (d.person) { S.openPerson = S.openPerson === d.person ? null : d.person; return render(); }
  if (d.songDates) { S.openSong = S.openSong === d.songDates ? null : d.songDates; return render(); }
  if (d.entType) { S.entType = d.entType; S.entPage = 0; return render(); }
  if (d.entYear) { S.entYear = d.entYear; S.entPage = 0; return render(); }
  if (d.entPage !== undefined && el.hasAttribute('data-ent-page')) {
    S.entPage = Math.max(0, +d.entPage);
    window.scrollTo(0, 0);
    return render();
  }
  if (d.kind) { S.draft.kind = d.kind; return render(); }

  if (d.go) {
    const dateEl = document.getElementById('draft-date');
    S.draft.date = dateEl ? dateEl.value : S.draft.date;
    const nameEl = document.getElementById('draft-name'), labEl = document.getElementById('draft-label');
    if (nameEl) S.draft.name = nameEl.value;
    if (labEl) S.draft.label = labEl.value;
    const label = S.draft.kind === 'other'
      ? (S.draft.label || (S.draft.name || '?').slice(0,2)) : KIND_LABEL[S.lang][S.draft.kind];
    const row = { date: S.draft.date, kind: S.draft.kind, label, name: S.draft.kind === 'other' ? S.draft.name : null };
    const ev = S.events.find(x => x.date === row.date && x.kind === row.kind && (x.name || '') === (row.name || ''));
    S.pending = ev ? null : row;          // written only when Save is pressed
    S.edit = null; S.pickOpen = null; S.query = '';
    location.hash = '#/admin/' + (d.go === 'att' ? 'attendance' : 'songs') + '/' + (ev ? ev.id : 'new');
    return;
  }

  if (d.toggleAbsent && S.edit) {              // present ↔ absent
    S.toast = ''; S.retry = null;
    S.edit.sel.has(d.toggleAbsent) ? S.edit.sel.delete(d.toggleAbsent)
                                   : S.edit.sel.set(d.toggleAbsent, 'absent');
    return render();
  }
  if (d.toggleSong && S.edit) {
    S.toast = ''; S.retry = null;
    const sel = S.edit.sel;
    if (sel.has(d.toggleSong)) sel.delete(d.toggleSong);
    else sel.set(d.toggleSong, { pos: sel.size + 1, c: '', p: '' });   // added at the end
    renumber(); return render();
  }
  if (d.move && S.edit) {                          // swap with the neighbour
    const [dir, id] = d.move.split(':');
    const ids = orderedSel(), i = ids.indexOf(id), j = dir === 'up' ? i - 1 : i + 1;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids.splice(j, 0, ids.splice(i, 1)[0]);
    const cur = S.edit.sel;
    S.edit.sel = new Map(ids.map((k, n) => {
      const v = cur.get(k);
      return [k, { pos: n + 1, c: (v && v.c) || '', p: (v && v.p) || '' }];
    }));
    return render();
  }
  if (el.hasAttribute('data-toggle-cancel') && S.edit) {
    S.toast = ''; S.retry = null;
    S.edit.cancelled = !S.edit.cancelled;          // marks stay in the buffer, so untapping is a true undo
    return render();
  }
  if (d.cancelMarks) {
    e.preventDefault();
    if (editDirty() && !confirm(t('discardQ'))) return;
    S.edit = null; S.pending = null;
    location.hash = '#/admin/' + (d.cancelMarks === 'att' ? 'attendance' : 'songs');
    return;
  }
  if (el.hasAttribute('data-save-marks')) {
    const E = S.edit; if (!E) return;
    if (!await ensureSession()) return;
    S.toast = ''; S.retry = null;
    let evId = E.evId;
    if (evId === 'new') {
      const { data, error } = await sb.from('events')
        .insert(Object.assign({}, S.pending,
          { cancelled: !!E.cancelled, attendance_taken: E.mode === 'att' })).select().single();
      if (error) return fail(error);
      S.events.push(data); S.events.sort((a,b) => a.date < b.date ? -1 : 1);
      evId = data.id; S.pending = null;
    }
    const evRow0 = S.events.find(x => x.id === evId);
    const patch = {};
    if (E.cancelled !== E.wasCancelled) patch.cancelled = E.cancelled;
    if (E.mode === 'att' && evRow0 && !evRow0.attendance_taken) patch.attendance_taken = true;
    if (Object.keys(patch).length && E.evId !== 'new') {
      const { error } = await sb.from('events').update(patch).eq('id', evId);
      if (error) return fail(error);
    }
    const evRow = S.events.find(x => x.id === evId);
    if (evRow) { evRow.cancelled = E.cancelled; if (E.mode === 'att') evRow.attendance_taken = true; }
    if (isAttCancelled(E)) E.sel = new Map();      // a cancelled date records nobody
    const isAtt = E.mode === 'att';
    const table = isAtt ? 'absences' : 'event_songs';
    const col   = isAtt ? 'singer_id' : 'song_id';
    const row   = (k, v) => isAtt
      ? { event_id: evId, singer_id: k, status: v === 'na' ? 'not_listed' : 'absent' }
      : { event_id: evId, song_id: k, position: v.pos,
          conductor_id: v.c || null, pianist_id: v.p || null };
    const { del, ins } = editDelta();
    if (del.length) {   // delete first: a state change is a delete + insert
      const { error } = await sb.from(table).delete().eq('event_id', evId).in(col, del);
      if (error) return fail(error);
    }
    if (ins.length) {
      const { error } = await sb.from(table).insert(ins.map(([k,v]) => row(k,v)));
      if (error) return fail(error);
    }
    const rows = [...E.sel].map(([k,v]) => row(k,v));
    if (E.mode === 'att') S.absences = S.absences.filter(a => a.event_id !== evId).concat(rows);
    else S.eventSongs = S.eventSongs.filter(x => x.event_id !== evId).concat(rows);
    S.edit = null; okToast(t('savedOk'));
    location.hash = '#/admin/' + (E.mode === 'att' ? 'attendance' : 'songs');
    render();
    return load(true);   // silent re-read, so the grids match the database exactly
  }

  if (d.delEvent) {
    e.preventDefault();
    if (!confirm(t('deleteEvent'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('events').delete().eq('id', d.delEvent).select();
    if (!wrote(res)) return render();
    S.events = S.events.filter(x => x.id !== d.delEvent);
    S.absences = S.absences.filter(a => a.event_id !== d.delEvent);
    S.eventSongs = S.eventSongs.filter(x => x.event_id !== d.delEvent);
    return render();
  }
  if (d.open) {
    const [kind, id] = d.open.split(':'), K = SHEETKIND[kind];
    const song = S.songs.find(s => s.id === id);
    if (!song || !song[K.col]) return;
    const w = window.open('', '_blank');          // opened before the await, or the popup blocker eats it
    const { data, error } = await sb.storage.from(K.bucket).createSignedUrl(song[K.col], 3600);
    if (error || !data) { if (w) w.close(); return fail(error || new Error('signing failed')); }
    if (w) w.location = data.signedUrl; else location.href = data.signedUrl;
    return;
  }
  if (d.lock) {
    const [kind, id] = d.lock.split(':'), K = SHEETKIND[kind];
    const song = S.songs.find(s => s.id === id);
    if (!song || !song[K.col]) return;
    if (!await ensureSession()) return;
    const next = !song[K.lock];
    const from = song[K.col];
    const to = next ? 'locked/' + from.replace(/^locked\//, '')
                    : from.replace(/^locked\//, '');
    if (to !== from) {                            // moving it is what actually enforces the rule
      const mv = await sb.storage.from(K.bucket).move(from, to);
      if (mv.error) return fail(mv.error);
    }
    const { error } = await sb.from('songs').update({ [K.col]: to, [K.lock]: next }).eq('id', song.id);
    if (error) { await sb.storage.from(K.bucket).move(to, from); return fail(error); }
    song[K.col] = to; song[K.lock] = next;
    return render();
  }
  if (d.delPdf) {
    const K = SHEETKIND[d.sheetKind || 'sheets'];
    const song = S.songs.find(s => s.id === d.delPdf);
    if (!song || !song[K.col] || !confirm(t('confirmRemovePdf'))) return;
    const path = song[K.col];
    const { error } = await sb.from('songs').update({ [K.col]: null }).eq('id', song.id);
    if (error) return fail(error);
    song[K.col] = null; render();
    await sb.storage.from(K.bucket).remove([path]);
    return;
  }
  if (d.export) { return exportCSV(d.export); }
  if (el.hasAttribute('data-dismiss')) { S.toast = ''; S.retry = null; return render(); }
  if (el.hasAttribute('data-retry')) { const r = S.retry; S.toast = ''; S.retry = null; render(); return r && r(); }

  if (d.addSong !== undefined && el.hasAttribute('data-add-song')) {
    const title = document.getElementById('new-song-title').value.trim();
    if (!title) return;
    const subtitle = document.getElementById('new-song-sub').value.trim() || null;
    const { data, error } = await sb.from('songs').insert({ title, subtitle }).select().single();
    if (error) return fail(error);
    S.songs.push(data); S.songs.sort((a,b) => a.title.localeCompare(b.title)); return render();
  }
  if (d.editSong) {
    const s = S.songs.find(x => x.id === d.editSong);
    const title = prompt(t('renameSong'), s.title); if (title === null) return;
    const clean = title.trim(); if (!clean) return;
    const subtitle = prompt(t('subtitle'), s.subtitle || '');
    if (!await ensureSession()) return;
    const res = await sb.from('songs').update({ title: clean, subtitle: (subtitle || '').trim() || null })
      .eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.title = clean; s.subtitle = (subtitle || '').trim() || null;
    S.songs.sort((a,b) => a.title.localeCompare(b.title));
    return render();
  }
  if (d.delSong) {
    if (!confirm(t('deleteSong'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('songs').delete().eq('id', d.delSong).select();
    if (!wrote(res)) return render();
    S.songs = S.songs.filter(x => x.id !== d.delSong);
    S.eventSongs = S.eventSongs.filter(x => x.song_id !== d.delSong);
    return render();
  }
  if (d.addRole) {
    const el2 = document.getElementById('new-role-name');
    const name = el2 ? el2.value.trim() : '';
    if (!name) return;
    if (!await ensureSession()) return;
    const { data, error } = await sb.from('singers')
      .insert({ name, part: null, [d.addRole]: true }).select().single();
    if (error) return fail(error);
    S.singers.push(data); return render();
  }
  if (el.hasAttribute('data-add-singer')) {
    const name = document.getElementById('new-singer-name').value.trim();
    if (!name) return;
    const part = document.getElementById('new-singer-part').value;
    const { data, error } = await sb.from('singers').insert({ name, part }).select().single();
    if (error) return fail(error);
    S.singers.push(data); return render();
  }
  if (d.editSinger) {
    const s = S.singers.find(x => x.id === d.editSinger);
    if (S.memTab !== 'singers') {                 // on a role tab, Edit removes the role
      const role = S.memTab === 'pianists' ? 'is_pianist' : 'is_conductor';
      if (!confirm(t('confirmDropRole'))) return;
      if (!await ensureSession()) return;
      const res = await sb.from('singers').update({ [role]: false }).eq('id', s.id).select();
      if (!wrote(res)) return render();
      s[role] = false; return render();
    }
    const name = prompt(t('renameSinger'), s.name); if (name === null) return;
    const clean = name.trim(); if (!clean) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').update({ name: clean }).eq('id', s.id).select();
    if (!wrote(res)) return render();
    s.name = clean; return render();
  }
  if (d.delSinger) {
    const person = S.singers.find(x => x.id === d.delSinger);
    if (S.memTab !== 'singers' && person && isSinger(person)) {
      alert(t('singerKeepNote')); return;        // they sing; only the role can go
    }
    if (!confirm(t('deleteSinger'))) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').delete().eq('id', d.delSinger).select();
    if (!wrote(res)) return render();
    S.singers = S.singers.filter(x => x.id !== d.delSinger);
    S.absences = S.absences.filter(x => x.singer_id !== d.delSinger);
    return render();
  }

  if (el.hasAttribute('data-signout')) { await sb.auth.signOut(); S.session = null; location.hash = '#/attendance'; return; }
});

document.addEventListener('change', async e => {
  const el = e.target;
  if (el.dataset.credit && S.edit) {
    const [slot, songId] = el.dataset.credit.split(':');
    const v = S.edit.sel.get(songId);
    if (v) { S.edit.sel.set(songId, Object.assign({}, v, { [slot]: el.value })); render(); }
    return;
  }
  if (el.dataset.markRole) {                    // give an existing person the role
    const role = el.dataset.markRole, id = el.value;
    if (!id) return;
    if (!await ensureSession()) return;
    const res = await sb.from('singers').update({ [role]: true }).eq('id', id).select();
    if (!wrote(res)) return render();
    const p = S.singers.find(x => x.id === id);
    if (p) p[role] = true;
    return render();
  }
  if (el.dataset.upload) {
    const song = S.songs.find(s => s.id === el.dataset.upload);
    const file = el.files && el.files[0];
    if (!song || !file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { alert(t('pdfOnly')); return; }
    const kind = el.dataset.sheetKind || 'sheets', K = SHEETKIND[kind];
    const old = song[K.col];
    const path = sheetPath(song[K.lock], song.id);
    el.value = '';                        // so picking the same file again still fires
    S.uploading = kind + ':' + song.id; render();
    const up = await sb.storage.from(K.bucket).upload(path, file, { contentType: 'application/pdf' });
    if (up.error) { S.uploading = null; return fail(up.error); }
    const { error } = await sb.from('songs').update({ [K.col]: path }).eq('id', song.id);
    if (error) { S.uploading = null; await sb.storage.from(K.bucket).remove([path]); return fail(error); }
    song[K.col] = path;
    if (old) await sb.storage.from(K.bucket).remove([old]);
    S.uploading = null; return render();
  }
  if (el.dataset.range) {
    const v = el.value;
    S.preset = null;
    if (el.dataset.edge === 'from') S.from = v; else S.to = v;
    render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    S.query = e.target.value;
    const pos = e.target.selectionStart; render();
    const again = document.getElementById('q'); if (again) { again.focus(); again.setSelectionRange(pos, pos); }
  }
});
window.addEventListener('hashchange', () => {
  S.route = location.hash || '#/home';
  if (!/^#\/admin\/(attendance|songs)\/.+/.test(S.route)) { S.edit = null; S.pending = null; }
  S.error = ''; S.query = '';
  render();
});

/* ---------- boot ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
window.addEventListener('online', () => { if (S.toast) { S.toast = ''; render(); } load(true); });
S.from = shift(6); S.to = today();
let wasWide = isWide();
window.addEventListener('resize', () => { if (isWide() !== wasWide) { wasWide = isWide(); render(); } });
const { data: { session } } = await sb.auth.getSession();
S.session = session;
sb.auth.onAuthStateChange((_e, s) => { S.session = s; render(); });
// iOS suspends a home-screen app rather than closing it: the token can be hours
// stale when it comes back. Refresh it, and re-read the data, on return.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible') return;
  if (S.session) await ensureSession();
  load(true);
});
await load();
</script>
</body>
</html>
